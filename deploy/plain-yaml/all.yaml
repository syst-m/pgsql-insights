---
# Source: pgsi/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgsi
  namespace: pgsi
  labels:
    helm.sh/chart: pgsi-0.1.0
    app.kubernetes.io/name: pgsi
    app.kubernetes.io/instance: pgsi
    app.kubernetes.io/version: "0.1.0-dev"
    app.kubernetes.io/part-of: pgsql-insights
data:
  # R11.8: the ConfigMap layer of the precedence chain (CLI flags > PGSI_* env >
  # ConfigMap > built-in defaults). Phase 0's binary takes flags only, so the
  # file is shipped now to freeze the contract before Phase 2 reads it.
  config.yaml: |
    listen: ":8080"
    shutdownTimeout: "10s"
    # R13.7 — the config-layer half of the level. cmd/pgsi/config.go:151 maps the
    # flag `log-level` to this key, so the flag and the file carry one value.
    logLevel: "info"

---
