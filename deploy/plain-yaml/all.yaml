# Source: pgsi/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: pgsi
  namespace: pgsi
  labels:
    helm.sh/chart: pgsi-0.1.0
    app.kubernetes.io/name: pgsi
    app.kubernetes.io/instance: pgsi
    app.kubernetes.io/version: "0.1.0-dev"
    app.kubernetes.io/part-of: pgsql-insights
spec:
  type: ClusterIP
  ports:
    # R8.7: the single HTTP port serves the API, the UI and /metrics. Named `http`
    # so the probes (R11.2) and the ServiceMonitor (R9.1) reference it by name.
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: pgsi
    app.kubernetes.io/instance: pgsi

---
# Source: pgsi/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgsi
  namespace: pgsi
  labels:
    helm.sh/chart: pgsi-0.1.0
    app.kubernetes.io/name: pgsi
    app.kubernetes.io/instance: pgsi
    app.kubernetes.io/version: "0.1.0-dev"
    app.kubernetes.io/part-of: pgsql-insights
  annotations:
    # R11.8: a ConfigMap change must roll the pod, since Phase 0's binary reads
    # its configuration at start.
    checksum/config: 68105d92b73f16d6114b1f52aa6de07f4b2803cc3b4d31460ad98d3d177d6f11
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # R11.15: a ReadWriteOnce PVC cannot attach to two pods on different nodes, so
  # RollingUpdate would strand the new pod in ContainerCreating. With an RWO-backed
  # single replica the only correct strategy is Recreate.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pgsi
      app.kubernetes.io/instance: pgsi
  template:
    metadata:
      labels:
        helm.sh/chart: pgsi-0.1.0
        app.kubernetes.io/name: pgsi
        app.kubernetes.io/instance: pgsi
        app.kubernetes.io/version: "0.1.0-dev"
        app.kubernetes.io/part-of: pgsql-insights
      annotations:
        checksum/config: 68105d92b73f16d6114b1f52aa6de07f4b2803cc3b4d31460ad98d3d177d6f11
    spec:
      serviceAccountName: pgsi
      # R12.7: pod-level securityContext (runAsNonRoot/runAsUser/seccompProfile/fsGroup).
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: pgsi
          image: "ghcr.io/frankellis/pgsql-insights:0.1.0-dev"
          imagePullPolicy: IfNotPresent
          # R12.7: container-level hardening — readOnlyRootFilesystem,
          # allowPrivilegeEscalation: false, capabilities drop [ALL], seccomp.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          # R11.1: one image, one process; the role is selected by the subcommand
          # (R3.1). v1 ships `serve` only (IMPLEMENTATION.md D9).
          args:
            - serve
            # R1.1 / R12.3 — discovery scope. A namespaced Role can authorise a LIST
            # only inside its own namespace, but discovery returns
            # metav1.NamespaceAll whenever --namespaces is empty and
            # --exclude-namespaces is too (discovery.go:284 -> :295-296), so leaving
            # the flag off under a namespaced Role asks for a cluster-scoped LIST the
            # Role cannot grant: every watch returns Forbidden, and R8.7 keeps
            # /readyz at 503 while any informer is unsynced — a pod that serves and
            # is live but never Ready. The release namespace is exactly the set the
            # Role can see, so render it. With rbac.allNamespaces=true the
            # ClusterRole does authorise the cluster-scoped LIST, so the flag stays
            # off there and discovery keeps NamespaceAll.
            - --namespaces=pgsi
            - --listen=:8080
            - --shutdown-timeout=10s
            # R13.7 — level-configurable logging (cmd/pgsi/main.go:329, default info).
            # `with` rather than a bare render: an empty value would pass
            # `--log-level=`, which internal/logx rejects at startup (logx_test.go:64
            # pins that an invalid level fails loudly), so omitting the flag and
            # letting the binary's own default apply is the only safe empty case.
            - --log-level=info
            # R8.8: cmd/pgsi's own default is --auth=token, so a profile that
            # turns auth off has to say so — omitting the flag would turn auth
            # back on. The chart's default profile ships auth.enabled=false,
            # which is why the rendered default args carry --auth=none.
            - --auth=none
            # R8.9 (as rewritten in f08b6ac): --auth-metrics governs /metrics
            # alone. /healthz and /readyz are never auth-gated under any value
            # of either flag -- kubelet's httpGet probe cannot present a bearer
            # token -- and /debug/pprof/* follows --auth. none is the
            # requirement's default, so a Prometheus scrape needs no token.
            - --auth-metrics=none
            # R8.9: empty means no CORS headers at all, which is correct for the
            # same-origin deployment R8.6 describes (the SPA is served here).
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # R11.2: distroless has no shell, so both probes are httpGet — an exec
          # probe cannot run inside the image.
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: http
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 96Mi
          volumeMounts:
            - name: config
              mountPath: /etc/pgsi
              readOnly: true
            # R12.7: readOnlyRootFilesystem requires a writable /tmp as an emptyDir.
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /var/lib/pgsi
      volumes:
        - name: config
          configMap:
            name: pgsi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: data
          persistentVolumeClaim:
            claimName: pgsi-data

---
# Source: pgsi/templates/servicemonitor.yaml
# R9.1 — the Service is scraped directly; R11.7 ships the PodMonitor as a variant.
#
# R9.9 names this key `metrics.serviceMonitor.enabled`; Phase 0 shipped it as
# `monitoring.serviceMonitor.enabled`. The spec's name won (chart README,
# "Values namespace").
#
# API version validated against the reference environment's installed CRD
# (R9.9's "[A]" clause): `servicemonitors.monitoring.coreos.com`, single served
# version `v1`, from kube-prometheus-stack 66.1.1 / prometheus-operator 0.78.1.
# Every field emitted below exists in that CRD's openAPIV3Schema — see the
# field-by-field table in chart/README.md.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pgsi
  namespace: pgsi
  labels:
    helm.sh/chart: pgsi-0.1.0
    app.kubernetes.io/name: pgsi
    app.kubernetes.io/instance: pgsi
    app.kubernetes.io/version: "0.1.0-dev"
    app.kubernetes.io/part-of: pgsql-insights
spec:
  # R9.9 [A]: a ServiceMonitor is only scraped if the local Prometheus selects on
  # it. The reference environment's Prometheus requires `release: prom-operator`
  # (spec.serviceMonitorSelector), so `additionalLabels` is not cosmetic — with
  # `{}` the object is created and silently ignored. chart/README.md gives the
  # per-install one-liner.
  selector:
    matchLabels:
      app.kubernetes.io/name: pgsi
      app.kubernetes.io/instance: pgsi
  # Scrape only the Service this chart owns, in this release's namespace. Without
  # this the CRD defaults to "the ServiceMonitor's own namespace", which is the
  # same thing today but stops being true the moment someone moves the CR to a
  # monitoring namespace (R9.1's cross-namespace scrape).
  namespaceSelector:
    matchNames:
      - pgsi
  endpoints:
    # `port` must name a Service port (R8.7's single HTTP port, named `http` in
    # templates/service.yaml). Not a number — a numeric port is a schema error on
    # this CRD; use targetPort for that.
    - port: http
      path: /metrics
      interval: 60s
      scrapeTimeout: 10s
---
# Source: pgsi/templates/tests/test-connection.yaml
# R16.4 — `helm test pgsi` runs this hook pod: it curls /healthz through the
# Service, which is the same assertion R11.14 asks a human to make.
apiVersion: v1
kind: Pod
metadata:
  name: pgsi-test-connection
  namespace: pgsi
  labels:
    helm.sh/chart: pgsi-0.1.0
    app.kubernetes.io/name: pgsi
    app.kubernetes.io/instance: pgsi
    app.kubernetes.io/version: "0.1.0-dev"
    app.kubernetes.io/part-of: pgsql-insights
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    fsGroup: 65532
    runAsGroup: 65532
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: "curlimages/curl:8.10.1"
      args:
        - -sSf
        - http://pgsi:8080/healthz
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault

