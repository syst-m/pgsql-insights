# R11.11 / R11.16 — CI is the source of truth; the Makefile is its local mirror.
# Every job here has a `make` equivalent so a developer can reproduce a red CI run
# without guessing (R11.11). Job order mirrors the spec's pipeline:
#   build -> lint -> unit tests -> web (R10.1/R16.7) -> helm lint ->
#   helm template snapshots -> image build (multi-arch) -> image publication.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.0"
  GOLANGCI_LINT_VERSION: "v1.64.8"
  # R15.3 names go-licenses as the audit's tool, so it is pinned like the other
  # toolchain pins here rather than floating on @latest — an unpinned resolver changes
  # the license strings it reports, and the report is a committed file.
  GO_LICENSES_VERSION: "v1.6.0"
  HELM_VERSION: "v4.3.1"
  # R11.16 / Q6: provisional registry org — see README and IMPLEMENTATION.md §5.
  IMAGE_REPO: ghcr.io/frankellis/pgsql-insights

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go.mod tidy check (R13.10)
        run: make tidy-check
      - name: build
        run: make build
      # D6: the old check was `grep -q "$(git rev-parse --short HEAD)"
      # version.txt`, which a binary stamped with some *other* commit could pass
      # — the first published binary did exactly that (stamped a47e149, built
      # from db4f237). This parses the field out of the output and compares it to
      # $GITHUB_SHA, then checks the other half of R11.3's tag pair: the
      # 7-character tag the image job publishes (`${GITHUB_SHA::7}`, and the
      # Dockerfile's org.opencontainers.image.revision) must be this commit's
      # first 7 characters. For both push and pull_request events, actions/
      # checkout puts HEAD at github.sha, so the comparison is exact.
      - name: version output carries ldflags (R11.3)
        run: |
          ./bin/pgsi version | tee version.txt
          commit="$(sed -n 's/^pgsi .* (commit \([^)]*\))$/\1/p' version.txt)"
          test -n "$commit" || { echo "no commit parsed from 'pgsi version' output"; exit 1; }
          if [ "$commit" != "$GITHUB_SHA" ]; then
            echo "binary stamped $commit but this build is $GITHUB_SHA (R11.3, D6)"; exit 1
          fi
          if [ "${commit:0:7}" != "${GITHUB_SHA:0:7}" ]; then
            echo "7-char form ${commit:0:7} != image tag ${GITHUB_SHA:0:7} (R11.3 tag pair)"; exit 1
          fi
          echo "ok: binary commit $commit == $GITHUB_SHA, image tag ${GITHUB_SHA:0:7}"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: spec parity matrix (requirements.md §6 vs the §7.3 index)
        run: bash scripts/check-parity-matrix.sh
      # docs/architecture.md's as-built table (R14.3's honesty rule): the "Where it lives"
      # column is a hand-maintained copy of `git ls-tree -r --name-only HEAD`, so every
      # file count and file name in it rots the moment anyone commits without editing the
      # row. The check is scripts/gen-as-built-table.py --check; `make as-built-check` is
      # its local mirror (R11.11: CI runs no command the Makefile lacks).
      - name: as-built table matches the tree (R14.3)
        run: make as-built-check
      # D6's short-SHA rule, scripts half. The step above the OpenAPI check in this job is
      # ci.yml's record of the original defect: the check became a $GITHUB_SHA comparison
      # on the binary, which removed CI's only use of `--short` and left nothing to catch a
      # script using it — so scripts/build-push-dev.sh:20 shipped `git rev-parse --short`
      # and stayed green until A4's 6a9ba00. R8.1c's precedent puts a doc-consistency gate
      # that can fail the build in this job, and `make sha-check` is its local mirror
      # (R11.11: CI runs no command the Makefile lacks).
      - name: no short SHAs in scripts (D6)
        run: make sha-check
      # R8.1's "checked in CI" half: the document api/embed.go ships is the one
      # GET /api/v1/openapi serves, so a broken document is a broken endpoint.
      # The check is scripts/check-openapi.py; `make openapi-check` is its local
      # mirror (R11.11: CI runs no command the Makefile lacks).
      - name: OpenAPI document validates (R8.1)
        run: make openapi-check
      # R13.4's assertion half: the exported series count for the fixture cluster set,
      # computed from requirements.md §5's family table. `make cardinality-check` is its
      # local mirror (R11.11). It gates on the highest published figure, so a table edit
      # that outruns the published budget fails here rather than in a Prometheus bill.
      - name: cardinality budget (R13.4)
        run: make cardinality-check
      # R15.3's second clause — "committed as docs/licenses/ *and regenerated in CI*".
      # Until now the first half existed and the second was only asserted by
      # docs/licenses/README.md: `make licenses` appeared nowhere in this file, so the
      # manifest could drift by any amount and stay green. `make licenses-check`
      # regenerates from go.mod + web/package-lock.json and fails on drift, the same
      # shape as the render-check gate in the helm job (R11.13). It belongs in this job
      # because R8.1c's row is the precedent for where a doc-consistency gate that can
      # fail the build goes: "the `lint` job beside `scripts/check-parity-matrix.sh`".
      # `make licenses` writes docs/licenses/go-licenses-report.csv only when the
      # binary is on PATH. Without this step CI would generate two files against the
      # three committed here, and go-dependencies.txt's license-names header would
      # revert to its "pending" form — so the check would fail on a runner that simply
      # lacks the tool. Verified: the report is byte-identical under GOOS=linux
      # GOARCH=amd64 and on darwin/arm64 (53 rows both), so the committed CSV is what
      # a linux runner produces.
      - name: install go-licenses ${{ env.GO_LICENSES_VERSION }}
        run: |
          go install github.com/google/go-licenses@${{ env.GO_LICENSES_VERSION }}
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: license manifest (R15.3)
        run: make licenses-check
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: golangci-lint (pinned, .golangci.yml v1 schema)
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --config .golangci.yml
          only-new-issues: false

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test
        run: go test ./... -count=1
      - name: coverage gate (R11.11)
        run: make cover

  # R10.1 + R16.7 — the web half of the test surface. It is a separate job (not a
  # step in `test`) because it needs a node toolchain the Go jobs don't, and
  # because its two harnesses fail for different reasons: Vitest points at
  # component logic, Playwright points at the rendered bundle.
  web:
    name: web (R10.1, R16.7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # web/package.json engines is >=22.12.0. Pinned to 22, not to the
          # bleeding edge: vitest 4.x excludes node 25, so a floating "node"
          # tag would silently break the harness on its next major.
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        run: npm ci --no-audit --no-fund
        working-directory: web
      - name: build (tsc --noEmit + vite build, R10.1)
        run: npm run build
        working-directory: web
      # R11.4's second number, reported separately from the image size.
      - name: SPA bundle size (R11.4)
        run: |
          js=web/dist/assets/index.js
          echo "$(wc -c < "$js" | tr -d ' ') raw / $(gzip -9 -c "$js" | wc -c | tr -d ' ') gzipped  $js"
          for f in web/dist/assets/*; do
            echo "$(wc -c < "$f" | tr -d ' ') raw / $(gzip -9 -c "$f" | wc -c | tr -d ' ') gzipped  $f"
          done
      - name: unit tests (Vitest, R16.7)
        run: npm run test
        working-directory: web
      - name: visual regression (Playwright, R16.7)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
        working-directory: web
      # The screenshots are the artefact a reviewer looks at: R16.7's visual
      # tests are only reviewable if the captured PNGs survive the run.
      - name: upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/e2e/report
          retention-days: 14

  helm:
    name: helm lint + template snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm ${{ env.HELM_VERSION }}
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      # R11.12: lint every named profile, not just the implicit one.
      - name: helm lint (default | production | lab)
        run: make helm-lint
      # R11.13 / R16.4: the committed manifests in deploy/plain-yaml ARE the golden
      # files. Re-render and require an empty diff — a chart change without a
      # committed manifest change fails the build.
      - name: helm template snapshot test (3 profiles)
        run: make render-check
      # R11.11: through the Makefile, like every other step here. The
      # --load-restrictor=LoadRestrictionsNone flag that kustomize v5.8.1 needs to read
      # ../plain-yaml/all.yaml lives in the `kustomize` target, not in this file.
      - name: kustomize build (R11.13 plain-yaml consumer)
        run: make kustomize

  image:
    name: multi-arch image (R11.2, R11.4)
    runs-on: ubuntu-latest
    needs: [build, lint, test, web, helm]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      # R11.2: one command must produce linux/amd64 AND linux/arm64. On a PR we build
      # to an OCI tarball (no push) so the R11.4 size gate still runs.
      # D6: COMMIT is the full SHA — the OCI image-spec convention for
      # org.opencontainers.image.revision and, now, what the binary's ldvar
      # carries too. The *tag* stays the 7-character form (R11.3); the build job
      # asserts the two are the same commit, which is what makes the pair
      # checkable instead of merely adjacent.
      - name: "build both platforms (PR: no push)"
        if: github.ref != 'refs/heads/main'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="${GITHUB_SHA::7}" --build-arg COMMIT="${GITHUB_SHA}" \
            -t ${{ env.IMAGE_REPO }}:pr-${{ github.event.number || github.sha }} \
            --output type=oci,dest=dist.oci.tar .
          python3 scripts/image-size.py --max-mb 100 dist.oci.tar
      # R11.16: main publishes :dev plus the git-SHA tag.
      - name: build + push (main)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg VERSION=0.1.0-dev --build-arg COMMIT="${GITHUB_SHA}" \
            -t ${{ env.IMAGE_REPO }}:dev \
            -t ${{ env.IMAGE_REPO }}:${GITHUB_SHA::7} \
            --push .
          docker buildx imagetools inspect ${{ env.IMAGE_REPO }}:dev
      # R11.4's second number — the SPA's gzipped JS — is printed by the same
      # command now that web/dist exists (scripts/image-size.py reports it as its
      # own section; it never gates, since the size limit applies to the image).
# R11.11 gate, measured 2026-11-24 at 6c0e003. Appended at EOF on purpose: the same
# block at the top would shift every line below it, and IMPLEMENTATION.md:1221 cites
# twelve ci.yml line numbers -- three form-A (:40, :139, :238 spelled with the path) and
# nine bare form-C (:42, :84, :90, :96, :117, :141, :203, :208, :213) that inherit the
# path from the line's first citation. The checker's form-A rule
# (scripts/check-parity-matrix.py:405) fails a cite only when its number exceeds the
# file's length, so a top insertion would leave all twelve "resolving" while pointing
# at the wrong lines. That is the ed58452 class named at the top of that script. The four
# `Makefile:` numbers on that row (:58, :93, :88, :247) were invisible to the checker until
# 8582636 taught P (:346) to alternate over CITE_NAMES -- before that P required a
# dot-extension, so an extensionless file was unattachable in form A.
#
#   run: lines              23   grep -c '^ *run:' .github/workflows/ci.yml
#   run: make <target>      10   grep -c '^ *run: make ' .github/workflows/ci.yml
#   run: | block scalars     6   grep -c '^ *run: |' .github/workflows/ci.yml
#   raw single commands      7   :75, :119, :121, :139, :161, :164, :175
#
# The ten target names, with their line numbers, are enumerated in IMPLEMENTATION.md's
# D3 row (:1221); :139 (`go test ./... -count=1`) and :238 (`python3
# scripts/image-size.py --max-mb 100 dist.oci.tar`) are recorded there as raw-command
# exceptions -- Makefile:58 and Makefile:247 exist, CI does not call them.
