# =============================================================================
# pgsi — lab profile (R11.6, R11.12, R13.6)
# =============================================================================
# A DELTA from values.yaml (see R11.12). The lab profile is the configuration the
# reference k3s environment is tested with: in-memory store, no PVC, auth off,
# cluster-scoped RBAC (the rbac block explains why that is not the single
# namespace R13.6's row names), no ServiceMonitor. R13.6 requires this profile to
# be testable without a StorageClass, a registry login or an ingress controller.
# =============================================================================

# Which profile this is (overridden from `default`).
profile: lab

# --- No persistence (overrides persistence.enabled: true) --------------------
# R13.6 — the lab install must work on a cluster with no StorageClass. The binary
# uses its in-memory store here (R11.6); the Deployment drops the volume.
persistence:
  enabled: false
  size: 1Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  mountPath: /var/lib/pgsi
  existingClaim: ""

# --- Smaller footprint (overrides resources) ---------------------------------
# R13.6 caps lab mode at "< 100 MB RAM", and `limits.memory` is the value that
# enforces it — 128Mi (134.2 MB) did not. 80Mi, not 96Mi: 96 MiB is 100.66 MB in
# decimal, so a 96Mi limit passes only if "MB" is read as "MiB"; 80Mi (83.9 MB) is
# under 100 on both readings. The request stays at 64Mi, so the pod keeps a 0.8
# request-to-limit ratio rather than the 0.5 the old pair implied.
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 80Mi

# --- Auth off (overrides auth.enabled: false, kept explicit) -----------------
auth:
  enabled: false
  tokenSecret: ""
  tokenKey: token

# --- Cluster-scoped RBAC (overrides rbac.allNamespaces: false) --------------
# R11.6 (:450) calls this profile "`--single-namespace` capable" and R13.6's row
# (:83) names `--single-namespace` as its shape — which is what false gives, and
# what this key read until 2026-11-24. It reads true now because the reference
# k3s environment this profile exists for runs its Postgres clusters in four
# *other* namespaces (ai-api-gateway, cookbook, freeidp, open-webui), and a
# namespaced Role in the release namespace cannot see any of them: with
# --namespaces rendered to the release namespace (deployment.yaml's
# rbac.allNamespaces=false branch) discovery finds no clusters there, and without
# the flag discovery asks for the cluster-scoped LIST a namespaced Role cannot
# authorise (discovery.go:284 -> :295-296). The reference install then ran a day
# on a ClusterRole applied by hand from this same render. R12.3's row carries the
# ruling (A3's S107, ratified in 10550ed) and names this file's :50 as the fix;
# R11.6's own wording is unchanged, so the value answers R12.3 while :450 still
# describes the profile as single-namespace-capable — which is where the default
# profile, which keeps false, satisfies R11.6 instead.
rbac:
  create: true
  allNamespaces: true
  allowPodsExec: false
  extraRules: []

# --- Monitoring off (overrides metrics.serviceMonitor.enabled: true) ---------
# The lab cluster may have no Prometheus operator, and the CRDs may not exist, so
# the lab profile renders no monitoring.coreos.com objects at all (R13.6: the
# lab path must work on a kind/minikube cluster with no operator installed).
# `metrics.enabled: false` is the master switch — with it off, none of the three
# CR templates render even if their own `.enabled` is true.
metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    path: /metrics
    interval: 60s
    scrapeTimeout: 10s
    additionalLabels: {}
  podMonitor:
    enabled: false
    path: /metrics
    interval: 60s
    scrapeTimeout: 10s
    additionalLabels: {}
  prometheusRule:
    enabled: false
    additionalLabels: {}
    groups: []

# --- No ingress, no NetworkPolicy, no PDB (kept explicit) --------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: pgsi.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
networkPolicy:
  enabled: false
  ingressFrom: []
  allowAllEgress: true
  egressPorts:
    - {port: 53, protocol: UDP}
    - {port: 53, protocol: TCP}
    - {port: 6443, protocol: TCP}
    - {port: 5432, protocol: TCP}
    - {port: 9187, protocol: TCP}
  extraEgress: []
  prometheusNamespace: monitoring
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

# --- The test hook runs here too (R16.4) -------------------------------------
tests:
  enabled: true
  image:
    repository: curlimages/curl
    tag: "8.10.1"
