# =============================================================================
# pgsi — the shipped default profile (R11.12)
# =============================================================================
# This file IS the default configuration: `helm install pgsi ./chart` with no -f
# renders exactly what is here. R11.12 exists because 0.1.0 shipped only
# values-production.yaml and values-lab.yaml, so an install with no -f produced
# an undocumented fourth configuration.
#
#   values.yaml / values-default.yaml  this file — the shipped default
#   values-production.yaml             documented delta: PVC-backed store, token
#                                      auth on, ServiceMonitor on, tighter limits
#   values-lab.yaml                    documented delta: in-memory store, auth
#                                      off, ServiceMonitor off, cluster-scoped
#                                      RBAC, no PVC (R11.6, R13.6)
#
# Both profiles are deltas from this file, not replacements for it: every key they
# change is commented with the value it overrides.
# =============================================================================

# R11.12 — name of the profile this file represents: default | production | lab.
# The two delta files override it so the rendered objects and NOTES.txt can say
# which profile produced them.
profile: default

image:
  # R11.16 / Q6: the registry org is still provisional (`frankellis`). Until the
  # org exists, the verifiable install path is the packaged chart tarball and the
  # image is published to whatever registry the target environment has — see the
  # README's "Provisional image registry" note and IMPLEMENTATION.md §5.
  repository: ghcr.io/frankellis/pgsql-insights
  # Empty → Chart.AppVersion. CI sets this to the git SHA tag (R11.16).
  tag: ""
  # Set to pin by digest (sha256:…). When set, pgsi.image renders
  # `repository@digest` and tag is ignored — the only immutable form of an image
  # reference, and therefore the only one pullPolicy: IfNotPresent below can
  # actually trust. A mutable tag plus IfNotPresent means a node reuses its
  # cached image after a new push: the reference environment hit exactly that on
  # 2026-11-24, where a fresh :dev push could not be rolled out until the pod
  # spec carried the digest, because the tag it named still resolved to the old
  # cached layer.
  digest: ""
  pullPolicy: IfNotPresent
  # R11.4: the amd64 image is ~3.3 MB compressed (distroless + a static Go binary),
  # far under the < 60 MB target. The SPA's gzipped JS is reported separately in CI.

imagePullSecrets: []
#   - name: registry-credentials

# The binary is `pgsi` (IMPLEMENTATION.md D3); the chart keeps that name for all
# rendered objects so `kubectl get deploy pgsi` matches `pgsi version`.
nameOverride: pgsi
fullnameOverride: ""

# R11.15: --role=serve is the only v1 role and uses a ReadWriteOnce PVC, so the
# default is exactly one replica. Raising it needs an RWX StorageClass or the
# Postgres-backed store (R11.15).
replicaCount: 1

# -----------------------------------------------------------------------------
# Runtime configuration (R11.8 precedence: CLI flags > PGSI_* env > ConfigMap > defaults)
# -----------------------------------------------------------------------------
# Phase 0's binary implements the flags below; the rest of the keys are rendered
# into the ConfigMap now so the file shape is frozen before Phase 2 wires them up.
config:
  # Render the ConfigMap at all. The Deployment mounts it and carries its checksum,
  # so keep this true unless you mount your own config via extraVolumes.
  createConfigMap: true
  # R8.7 — the address the HTTP server binds; the Service and both probes follow it.
  listen: ":8080"
  # R13.8 — graceful-shutdown drain budget. Keep below terminationGracePeriodSeconds.
  shutdownTimeout: 10s
  # R13.7 — level-configurable logging. cmd/pgsi/main.go:329 declares the flag with
  # built-in default `info`; the chart names it as a key so a profile can change the
  # level without reaching for extraArgs, and renders it both as the --log-level flag
  # and as the config.yaml key (cmd/pgsi/config.go:151 pairs the flag `log-level`
  # with the config key `logLevel`, so the two layers cannot disagree). `debug` is
  # R13.7's second clause: the level at which a collector dumps the SQL it executed.
  logLevel: info
  # Phase 2+ keys, rendered into the ConfigMap so the contract exists early:
  #   store: sqlite            # sqlite | memory (R11.6 lab profile uses memory)
  #   pollInterval: 60s        # R2.1
  #   singleNamespace: ""      # R1.1 — the one-namespace form of --namespaces
  #   logSource: off           # R5.10
  #   allowActions: []         # R12.8 — named mutations, off by default
  #   maxStoreBytes: 536870912 # R13.5
  extra: {}

# Extra CLI arguments appended verbatim to `pgsi serve`.
extraArgs: []

# R8.8 — auth on the API surface. Implemented in internal/api/auth.go and wired
# through cmd/pgsi's --auth/--auth-metrics/--auth-token* flags; the chart renders
# those flags from this block (see templates/deployment.yaml).
#
# Off in the default profile so a bare `helm install` serves unauthenticated,
# which is what Phase 0/1 shipped; values-production.yaml turns it on. The
# binary's own default is `token` (R8.8), so auth.enabled=false is not the same
# as omitting the flag — the template passes --auth=none explicitly.
auth:
  enabled: false
  # R8.8 mode for / and /api/v1/*: none | token | kube-rbac-proxy.
  # Only consulted when enabled=true; the binary's default is token.
  mode: token
  # R8.9 mode for /metrics alone (the grouping f08b6ac fixed in Go): /healthz
  # and /readyz are never auth-gated under any value of --auth or
  # --auth-metrics, and /debug/pprof/* follows --auth. `none` is the
  # requirement's own default and the reason auth is per-route-group rather
  # than global: Prometheus cannot present a bearer token, and neither can
  # kubelet's httpGet probes.
  metricsMode: none
  # Secret the pod reads the API token from (key `token`). Required when
  # enabled and mode is not `none`.
  tokenSecret: ""
  tokenKey: token
  # R8.9 CORS. Empty allow-list = no CORS headers, correct while the SPA is
  # served by this same binary (R8.6). Set it when the UI is deployed
  # separately, e.g. "https://pgsi.example.com". "*" is only valid with
  # allowCredentials=false (RFC 6454), and cors.go enforces that.
  corsAllowOrigin: ""
  corsAllowCredentials: false
  # "" → the binary's default of 5m.
  corsMaxAge: ""

# -----------------------------------------------------------------------------
# Pod surface
# -----------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 8080
  # Empty → config.listen's port. Named `http` so probes and ServiceMonitor agree.
  targetPort: ""
  annotations: {}
  # clusterIP: None          # headless for a StatefulSet-style install
  # loadBalancerIP: 10.0.0.1

# R11.2 — distroless has no shell, so BOTH probes are httpGet; an exec probe
# cannot run. /healthz is liveness, /readyz is readiness (R8.7).
livenessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
    scheme: HTTP
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
readinessProbe:
  enabled: true
  httpGet:
    path: /readyz
    port: http
    scheme: HTTP
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
startupProbe:
  enabled: false
  httpGet:
    path: /healthz
    port: http
    scheme: HTTP
  failureThreshold: 30
  periodSeconds: 2

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 500m
    memory: 256Mi

# R12.7 — PodSecurity `restricted`-compliant. Container-level fields carry
# readOnlyRootFilesystem / allowPrivilegeEscalation / capabilities / seccompProfile;
# pod-level carries runAsNonRoot / runAsUser / runAsGroup / seccompProfile / fsGroup.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# R12.7 — readOnlyRootFilesystem needs a writable /tmp as an emptyDir.
tmpVolume:
  enabled: true
  sizeLimit: 64Mi
  mountPath: /tmp

# R11.15 — storage access-mode contract. ReadWriteOnce is the default and the
# only mode the reference environment's StorageClasses (iscsi-ext4, iscsi-xfs)
# offer; the collector/server split is gated on RWX or the Postgres-backed store.
persistence:
  enabled: true
  size: 1Gi
  accessModes:
    - ReadWriteOnce
  # "" → the namespace's default StorageClass. The reference environment has
  # iscsi-ext4 (default) and iscsi-xfs; neither is local-path.
  storageClassName: ""
  mountPath: /var/lib/pgsi
  # Reuse an existing PVC instead of creating one (lab profile disables this).
  existingClaim: ""

terminationGracePeriodSeconds: 30
revisionHistoryLimit: 3
podAnnotations: {}
commonLabels: {}
commonAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
extraVolumes: []
extraVolumeMounts: []

# -----------------------------------------------------------------------------
# RBAC (R12.1–R12.3)
# -----------------------------------------------------------------------------
rbac:
  create: true
  # R12.3 — the default install is namespaced. ClusterRole/ClusterRoleBinding are
  # created ONLY when this is true, and helm uninstall removes them under the same
  # gate (R11.10: no cluster-scoped residue).
  allNamespaces: false
  # R12.2 — pods/exec is effectively code execution in the pod namespace, so it is
  # opt-in and absent from the default Role.
  allowPodsExec: false
  # Append-only escape hatch for environments with extra CRDs.
  extraRules: []

serviceAccount:
  create: true
  # "" → the chart fullname (`pgsi`).
  name: ""
  annotations: {}
  automountServiceAccountToken: true

# -----------------------------------------------------------------------------
# Metrics / monitoring (R9.1, R9.6, R9.9, R11.7)
# -----------------------------------------------------------------------------
# R9.9 names the key `metrics.serviceMonitor.enabled`; Phase 0 shipped this block
# as `monitoring:`. The spec's name won — one requirement, one key name (the
# chart README's "Values namespace" section records the rename).
#
# R9.9's "off by default" is about the flag's zero value: a values file that
# omits `metrics.serviceMonitor` renders no ServiceMonitor, because the template
# gates on a truthy `.enabled`. This profile sets it explicitly — see the header
# for what each profile ships.
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    path: /metrics
    interval: 60s
    # R9.9: scrapeTimeout must be <= interval; the CRD accepts any duration
    # string, so the chart cannot enforce it and 10s/60s is the shipped ratio.
    scrapeTimeout: 10s
    # Labels your Prometheus requires to discover the ServiceMonitor.
    # kube-prometheus-stack sets serviceMonitorSelector to {release: <release>};
    # the reference environment's is `release: prom-operator`
    # (docs/research/live-probe.md, re-read 2026-11-21 against
    # prom-operator-kube-prometh-prometheus). {} on clusters with a permissive
    # selector — and on the reference cluster, where {} means the object is
    # created but never scraped. See chart/README.md "Making it discoverable".
    additionalLabels: {}
    tlsConfig: {}
    relabelings: []
    metricRelabelings: []
  # R11.7 / R9.9 — the PodMonitor variant, for scraping pod IPs directly.
  # Same knob set as the ServiceMonitor (path/tlsConfig/relabelings/
  # metricRelabelings), because the CRD accepts the same set on both.
  podMonitor:
    enabled: false
    path: /metrics
    interval: 60s
    scrapeTimeout: 10s
    additionalLabels: {}
    tlsConfig: {}
    relabelings: []
    metricRelabelings: []
  # R9.6 / R9.11 — the rule set lands in Phase 4; the template exists now so
  # enabling it later is a values change, not a chart change.
  prometheusRule:
    enabled: false
    additionalLabels: {}
    groups: []

# -----------------------------------------------------------------------------
# Optional surfaces (R11.7)
# -----------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  # ingressClassName: nginx
  hosts:
    - host: pgsi.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #   - secretName: pgsi-tls
  #     hosts: [pgsi.local]

networkPolicy:
  enabled: false
  # Sources allowed to reach the UI/API port. When monitoring.serviceMonitor.enabled
  # the Prometheus namespace is added automatically (R9.1).
  ingressFrom: []
  #   - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
  # true → no egress rules (all outbound allowed). false → restrict to egressPorts.
  allowAllEgress: true
  egressPorts:
    - {port: 53, protocol: UDP}
    - {port: 53, protocol: TCP}
    - {port: 6443, protocol: TCP}
    - {port: 5432, protocol: TCP}
    - {port: 9187, protocol: TCP}
  extraEgress: []
  # Namespace where Prometheus lives, used to allow scrape traffic.
  prometheusNamespace: monitoring

podDisruptionBudget:
  # Off by default: a PDB needs >= 2 replicas, and R11.15 caps the default
  # install at 1 (RWO PVC). Enable together with a Postgres-backed store.
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

# Escape hatch: arbitrary extra manifests rendered verbatim under this release.
extraManifests: []

tests:
  # chart/tests/test-connection.yaml — `helm test pgsi` curls /healthz through the
  # Service (R16.4's install smoke test).
  enabled: true
  image:
    repository: curlimages/curl
    tag: "8.10.1"
