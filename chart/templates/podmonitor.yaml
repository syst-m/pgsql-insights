{{- if and .Values.metrics.enabled .Values.metrics.podMonitor.enabled }}
# R11.7 — the PodMonitor variant, for scraping pod IPs instead of the Service.
#
# R9.9 ships this alongside the ServiceMonitor; exactly one of the two is normally
# on, because enabling both scrapes the same /metrics twice and doubles the
# cardinality bill R9.10 documents.
#
# Field set validated against `podmonitors.monitoring.coreos.com` v1 as installed
# by kube-prometheus-stack 66.1.1 (prometheus-operator 0.78.1). Phase 0's version
# of this file exposed only port/interval/scrapeTimeout and hardcoded
# `path: /metrics`; the CRD accepts path, tlsConfig, relabelings and
# metricRelabelings here exactly as it does on a ServiceMonitor, so the two
# variants now take the same set of knobs (R9.9 says "the PodMonitor variant",
# not "a reduced second class").
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "pgsi.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pgsi.labels" . | nindent 4 }}
    {{- with .Values.metrics.podMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # Selects pods, not Services: this is the same label set templates/deployment.yaml
  # puts on the pod (and on the Service), so both monitors address one workload.
  selector:
    matchLabels:
      {{- include "pgsi.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  podMetricsEndpoints:
    # `port` names a *container* port (templates/deployment.yaml names it `http`);
    # the CRD's `targetPort` is the numeric form. Phase 0 hardcoded the path here
    # while the ServiceMonitor read it from values — one value, two behaviours.
    - port: http
      path: {{ .Values.metrics.podMonitor.path }}
      interval: {{ .Values.metrics.podMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.podMonitor.scrapeTimeout }}
      {{- with .Values.metrics.podMonitor.tlsConfig }}
      tlsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metrics.podMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metrics.podMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
