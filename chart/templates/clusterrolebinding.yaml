{{- if and .Values.rbac.create .Values.rbac.allNamespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pgsi.fullname" . }}
  labels:
    {{- include "pgsi.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pgsi.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pgsi.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
