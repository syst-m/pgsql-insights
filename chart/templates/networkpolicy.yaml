{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pgsi.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pgsi.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "pgsi.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if not .Values.networkPolicy.allowAllEgress }}
    - Egress
    {{- end }}
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingressFrom }}
        - {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled .Values.networkPolicy.prometheusNamespace }}
        # R9.1: allow the Prometheus namespace to scrape /metrics.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheusNamespace }}
        {{- end }}
    - ports:
        - port: {{ include "pgsi.containerPort" . }}
          protocol: TCP
  {{- if not .Values.networkPolicy.allowAllEgress }}
  egress:
    - ports:
        {{- toYaml .Values.networkPolicy.egressPorts | nindent 8 }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
