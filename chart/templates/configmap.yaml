{{- if .Values.config.createConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pgsi.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pgsi.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  # R11.8: the ConfigMap layer of the precedence chain (CLI flags > PGSI_* env >
  # ConfigMap > built-in defaults). Phase 0's binary takes flags only, so the
  # file is shipped now to freeze the contract before Phase 2 reads it.
  config.yaml: |
    listen: {{ .Values.config.listen | quote }}
    shutdownTimeout: {{ .Values.config.shutdownTimeout | quote }}
    # R13.7 — the config-layer half of the level. cmd/pgsi/config.go:151 maps the
    # flag `log-level` to this key, so the flag and the file carry one value.
    logLevel: {{ .Values.config.logLevel | quote }}
    {{- with .Values.config.extra }}
    {{ toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
