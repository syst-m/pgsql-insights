
# ---------------------------------------------------------------------------
# Planned routes — the manifest, and the grammar of its keys.
#
# What this file is. Generator input, not generated output: `internal/api/
# openapi_gen.go:16` embeds it and writes it into api/openapi.yaml at :144, one of
# the three inputs that file has (the route table from the go/ast walk over
# internal/api, the annotation table, and this manifest), which is why Makefile:101
# says editing api/openapi.yaml by hand does not survive the next `make openapi`.
# R14.7 requires every route *in code* to be documented; these are not in code, and
# putting them in `paths` would make the document claim routes that 404.
#
# Key grammar — one top-level key, one sub-key per requirement. The container is
# `x-planned-paths:` and it names the artifact, never a requirement; every key under
# it names exactly one requirement and is spelled `r<major>.<minor>-<slug>` —
# `r8.2-catalogue`, `r4.5-actions`, `r8.3-promql-pair`. A requirement with routes in
# both `paths` and here gets one key here, not one per verb and not one per page; a
# route two requirements name (R8.2's catalogue and R10.3's page) is filed under the
# one that enumerates the route, with the other named in the entry's own comment.
# Two keys exist today, `x-planned-paths:` at :56 and `r8.2-catalogue:` at :145 — one
# container and one requirement — and the four requirement keys that used to be here
# are retirement notes, not keys: r4.5-actions (:156), r8.3-promql-pair (:178), and
# r8.11-batched-series and r8.7-debug at the foot of the file. That closes the
# spelling: `planned_r8_2:`, `R8.2:` and a bare `catalogue:` are all unavailable,
# because a key named for a page rather than a requirement is how one route ends up
# listed twice under two owners.
#
# Entry form — a bare path string. `/api/v1/poolers`, no method prefix, no status
# field. `scripts/check-openapi.py:386` requires `entry.startswith("/")`, so
# `GET /api/v1/poolers` is a failure rather than a style choice (measured on a copy
# of the generated document: adding that one line under r8.2-catalogue exits 1 with
# `'GET /api/v1/poolers' is not a route path`). Set membership is the whole claim; a
# status field is what rots, so the ten entries carry their requirement ids in
# trailing comments and nothing that can disagree with the code.
#
# The assertion, and what enforces it. Per requirement key: that key's entries plus
# the `paths` entries the same requirement owns equal the route set requirements.md
# names for it — a partition per key, never a global count, because a global number
# cannot be attributed (R8.2's row has been wrong six times over: `grep -c '^  /api'`
# said 9, this file lists 12, the generated document has 21 paths, and none of the
# three is R8.2's route set). `paths` ∩ this file = ∅ is the half that makes a
# promotion visible. Enforced today: entry shape (check-openapi.py:379-388) and the
# implemented↔route pairing (`internal/api/openapi_gen.go:214` `checkRouteTable`,
# plus the `make openapi` byte-compare). Not enforced by any tool: the per-requirement
# partition and the disjointness — measured, re-adding the implemented
# `/api/v1/insights/queries` to r8.2-catalogue leaves check-openapi.py at rc 0, so
# the header states the assertion and the checker that fails it is not written yet.
#
# A move is a deletion with a retirement note, never a status flip. The four notes
# named above are the pattern: the route moves to `paths` in the commit that registers
# it, the entry here disappears in the same commit, and the note says what it was,
# which requirement owned it, and what the old text used to claim. A `status:` line
# would let a route be implemented and planned at once, which is the one state R14.7
# cannot represent.
# ---------------------------------------------------------------------------
x-planned-paths:
  # /api/v1/clusters/{namespace}/{name} was the first route in this list. It
  # moved up to `paths` when Phase 5 registered it (internal/api/cluster_detail.go),
  # and — per the rule the r8.3-promql-pair note below states — it was deleted
  # rather than marked: a planned path that is implemented is a second name for
  # a route that exists, and R14.7 counts one. `paths` and `x-planned-paths`
  # being disjoint is what makes that checkable, and it is the invariant
  # scripts/check-openapi.py owns.
  #
  # /api/v1/insights/queries (R8.2, R10.4) and /api/v1/insights/queries/{fingerprint}
  # (R8.2, R10.7) were the second and third routes from this list to be written —
  # internal/api/queries.go and internal/api/query_detail.go — and each moved up to
  # `paths` in the commit that registered it, so both entries are deleted rather
  # than marked, same rule.
  #
  # The list's commit had said of the detail route: "the list and the detail are
  # two routes, and landing one does not land the other." That sentence is why this
  # file lists them separately, and why the list's commit deleted one line and not
  # two. This commit deletes the second.
  #
  # /api/v1/insights/queries/{fingerprint}/plans (R3.10) was the fourth route from
  # this list, and the note here used to say it "stays planned even though the
  # detail response carries the same list inline in `plans`: R8.2 counts the route
  # separately, and an inline array on one response is not the route." That sentence
  # is now the reason the route exists rather than the reason it is planned:
  # internal/api/query_plans.go implements it and server.go registers it, so the
  # entry is deleted rather than marked, same rule as the three above. The route is
  # served by a not-found source until R3.10's capture lands (Phase 6b's), which is
  # not the same thing as being unimplemented — the handler answers, and what it
  # answers is 404 for every fingerprint, which is what R14.7 requires of a
  # documented route whose store is not yet populated.
  #
  # /api/v1/active-queries was the fifth route from this list, and its entry carried
  # the wrong requirement id: it read `# R3.11`, and requirements.md:316 is R3.11 —
  # "Detect **plan changes**: keep plan hashes per fingerprint and surface a
  # plan-change event when the hash changes for a stable fingerprint" — an R3
  # statement-plane feature whose API surface is the `planChanges` array on the query
  # detail (dto/queries.go's PlanChangeView), not a session list. The route's ids are
  # R4.1 and R4.2 (requirements.md:326-327) with R10.8 (:419) as the page, which is
  # what web/src/routes.ts:215 has always said. The id is corrected here rather than
  # carried, because a route filed under the wrong id is a route whose R3.11 row can
  # be marked done while the requirement that asks for it — R4.1 — is not.
  # internal/api/active_queries.go implements it and server.go registers it, so the
  # entry is deleted rather than marked, same rule as the four above.
  #
  # The other `# R…` annotations on this list were wrong in the same way, and this
  # commit fixes them: thirteen of its fourteen pre-fix entries carried one
  # (poolers/{namespace}/{name} has none) and eight named an id whose text is not that
  # path's requirement — six wholly, active-queries among them (the note above), and
  # two in part, /insights/system and /api/v1/insights/system/{metric}, which named
  # R5 and R8.2 correctly and R10.13 (responsive/themes) where the page is R10.10
  # (System Insights). The `(was: …)` on each corrected line is the old id; the new
  # ones are web/src/routes.ts's `requirement:` field for each page — the
  # machine-readable page→requirement→endpoint table, which is the source a comment
  # like this should be copied from rather than written from memory — unioned with the
  # requirements.md §4 row that names the endpoint (R4.3 for wait-events,
  # R3.7/R3.12/R6.4 for the four rollups), because routes.ts names pages and R8.2
  # names routes and those are not the same set.
  #
  # Nothing checks these comments — scripts/check-parity-matrix.py validates §4's id
  # set and the citation graph, not this file's inline annotations — so a wrong one is
  # wrong silently, which is why the fix is its own commit rather than a line inside
  # the active-queries commit that happened to notice.
  #
  # /api/v1/insights/tags (R3.12, R10.3) was the sixth route from this list — the
  # fifth was /api/v1/active-queries, the four before it are named above — and
  # internal/api/tags.go implements it and server.go registers it, so this commit
  # deletes the entry rather than marking it, same rule as the five above. The
  # handler is the last piece of the route set that already existed: dto.TagView and
  # dto.TagDigest (dto/queries.go), testdata/api/tags.json (which
  # web/src/api/fixtures.ts:115 has imported as Envelope<TagView> since the fixture
  # landed), and internal/store/rollups.go's Tags — whose header predicted this
  # route's signature and whose `var _ api.TagsSource = (*Store)(nil)` assertion
  # lands in the same commit as the interface it names, for the reason that header
  # gives. Twelve entries remained at that commit: the four other R3.7 rollups
  # (databases, users, client-addresses, and the R4.3 wait-events), the two
  # /insights/system routes, recommendations, the two poolers routes, events,
  # explain and search.
  #
  # /api/v1/poolers and /api/v1/poolers/{namespace}/{name} (R6; the second is
  # R8.2's, and the entry's own comment had it right — "PoolerView is already
  # defined (R8.2 reuses it)") were the seventh and eighth routes from this list to
  # be written. internal/api/poolers.go implements both and server.go registers
  # both, so this commit deletes the two entries rather than marking them, same rule
  # as the six above, and the count in the note above moves from twelve to ten with
  # them. They land in one commit because both read the same pooler rows of the
  # discovery inventory and dto.PoolerView already existed for R8.2's reuse: the
  # handler half was the only thing missing, and a list route and its detail route
  # that share one source cannot be staged apart.
  r8.2-catalogue:
    - /api/v1/insights/wait-events          # R4.3, R10.9 (was: R4, R10.7)
    - /api/v1/insights/databases            # R3.7, R10.3 (was: R10.8)
    - /api/v1/insights/users                # R3.7, R10.3 (was: R10.9)
    - /api/v1/insights/client-addresses     # R3.7, R6.4, R10.3 (was: R6, R10.12)
    - /api/v1/insights/system               # R5, R10.10 (was: R5, R10.13)
    - /api/v1/insights/system/{metric}      # R8.2, R10.10 (was: R8.2, R10.13)
    - /api/v1/insights/recommendations      # R8.2
    - /api/v1/events                        # R8.2
    - /api/v1/explain                       # R8.2
    - /api/v1/search                        # R8.2 (?q=)
  # r4.5-actions was the second live key, and it existed because R8.2's catalogue is
  # not the whole route set: R4.5 (requirements.md:330) names
  # `POST /api/v1/sessions/{pid}/terminate` — `pg_terminate_backend(pid)`, behind
  # R12.8's gate — and that path is not one of the twenty R8.2 lists at
  # requirements.md:374, so filing it under r8.2-catalogue would have attributed it
  # to a requirement that does not name it. The key is gone now rather than marked,
  # the rule the r8.3-promql-pair note below states: the route is in `paths`, and a
  # planned path that is implemented is a second name for a route that exists.
  #
  # The note here also used to say the route was "planned, not implemented: R4.5's
  # own text requires more than a handler — 'requiring a confirmed UI action, audited
  # to a log line with actor and target, and refused on a replica' — and all three of
  # those are Phase 6a's remaining scope." All three are in the handler now
  # (internal/api/sessions.go): the confirmation arrives as `?confirm=true`, the only
  # server-side form a UI dialog can take; the audit line and the response body are
  # written from one read of actor and target, which is what stops R4.5's two copies
  # of those two values from disagreeing; and the replica refusal is the source's
  # answer, mapped to the same 403 as the config gate for the reason the handler's
  # header gives. The sentence about R4.1's `Action` column rendering `disabled`
  # "while the action behind it is unbuilt" is the one this commit makes false: the
  # column now reads `terminate` whenever --allow-actions names it, from the same
  # actionFor call this route's gate makes.
  # r8.3-promql-pair was the second entry here: /api/v1/metrics/query and
  # /api/v1/metrics/system, GET|POST each. Both moved up to `paths` when R8.3
  # landed, so the entry is gone rather than marked — a planned-path that is
  # implemented is a second name for a route that exists, and R14.7 counts one.
  # The old note ended "it is enumerated here once Phase 2 names them", which
  # misread the requirement: R8.3 asks for the catalogue to be enumerated *in
  # this document*, now, and the enumeration is what makes "we answer from our
  # own store" a contract instead of a cache dump. It now lives on each path as
  # `x-promql-catalogue`, and TestCatalogueMatchesOpenAPIDocument (plus
  # scripts/check-openapi.py) enforces the two lists against the table in
  # internal/api/promql_catalogue.go.
  # r8.11-batched-series was the third entry here: GET
  # /api/v1/insights/queries/series?fingerprints=a,b,c&range=…, the one response
  # that answers the per-minute series for up to 50 fingerprints so R10.6's
  # per-row sparklines do not cost one request per row inside R10.14's 1.5 s
  # page-load budget. It moved up to `paths` in the commit that added the
  # handler (internal/api/series.go), so the entry is gone rather than marked —
  # the rule r8.3-promql-pairs states above: a planned-path that is implemented
  # is a second name for a route that exists, and R14.7 counts one.
  # r8.7-debug was the fourth entry here: /debug/pprof/ and its four sub-paths.
  # server.go registered them in Phase 1a and they moved up to `paths` in the
  # same commit, so R8.7's surface is now entirely in code and nothing under
  # that heading is planned. (The old note also had the auth story backwards —
  # pprof is in auth.go's GroupAPI and follows --auth, per R8.9.)
