
# ---------------------------------------------------------------------------
# Planned routes (R8.2, R8.11) — deliberately NOT under `paths` yet.
#
# R14.7 requires every route *in code* to be documented; these are not in code,
# and putting them in `paths` would make the document claim routes that 404.
# They are listed here so Phase 3/5 extend this file by promoting entries into
# `paths` — one edit per route — instead of restructuring it. The shape of the
# catalogue is fixed by R8.2, so this is a list of names, not a design.
# ---------------------------------------------------------------------------
x-planned-paths:
  # /api/v1/clusters/{namespace}/{name} was the first route in this list. It
  # moved up to `paths` when Phase 5 registered it (internal/api/cluster_detail.go),
  # and — per the rule the r8.3-promql-pair note below states — it was deleted
  # rather than marked: a planned path that is implemented is a second name for
  # a route that exists, and R14.7 counts one. `paths` and `x-planned-paths`
  # being disjoint is what makes that checkable, and it is the invariant
  # scripts/check-openapi.py owns.
  #
  # /api/v1/insights/queries (R8.2, R10.4) and /api/v1/insights/queries/{fingerprint}
  # (R8.2, R10.7) were the second and third routes from this list to be written —
  # internal/api/queries.go and internal/api/query_detail.go — and each moved up to
  # `paths` in the commit that registered it, so both entries are deleted rather
  # than marked, same rule.
  #
  # The list's commit had said of the detail route: "the list and the detail are
  # two routes, and landing one does not land the other." That sentence is why this
  # file lists them separately, and why the list's commit deleted one line and not
  # two. This commit deletes the second.
  #
  # /api/v1/insights/queries/{fingerprint}/plans (R3.10) was the fourth route from
  # this list, and the note here used to say it "stays planned even though the
  # detail response carries the same list inline in `plans`: R8.2 counts the route
  # separately, and an inline array on one response is not the route." That sentence
  # is now the reason the route exists rather than the reason it is planned:
  # internal/api/query_plans.go implements it and server.go registers it, so the
  # entry is deleted rather than marked, same rule as the three above. The route is
  # served by a not-found source until R3.10's capture lands (Phase 6b's), which is
  # not the same thing as being unimplemented — the handler answers, and what it
  # answers is 404 for every fingerprint, which is what R14.7 requires of a
  # documented route whose store is not yet populated.
  #
  # /api/v1/active-queries was the fifth route from this list, and its entry carried
  # the wrong requirement id: it read `# R3.11`, and requirements.md:316 is R3.11 —
  # "Detect **plan changes**: keep plan hashes per fingerprint and surface a
  # plan-change event when the hash changes for a stable fingerprint" — an R3
  # statement-plane feature whose API surface is the `planChanges` array on the query
  # detail (dto/queries.go's PlanChangeView), not a session list. The route's ids are
  # R4.1 and R4.2 (requirements.md:326-327) with R10.8 (:419) as the page, which is
  # what web/src/routes.ts:215 has always said. The id is corrected here rather than
  # carried, because a route filed under the wrong id is a route whose R3.11 row can
  # be marked done while the requirement that asks for it — R4.1 — is not.
  # internal/api/active_queries.go implements it and server.go registers it, so the
  # entry is deleted rather than marked, same rule as the four above.
  #
  # The six remaining `# R…` annotations on this list are also wrong in the same way
  # (seven of the twelve annotated entries name an id whose text is not that path's
  # requirement); that set is fixed in its own commit, whose subject is the fix, so
  # this commit's diff stays the size of the route it lands.
  r8.2-catalogue:
    - /api/v1/insights/wait-events          # R4, R10.7
    - /api/v1/insights/databases            # R10.8
    - /api/v1/insights/users                # R10.9
    - /api/v1/insights/tags                 # R7, R10.11
    - /api/v1/insights/client-addresses     # R6, R10.12
    - /api/v1/insights/system               # R5, R10.13
    - /api/v1/insights/system/{metric}      # R8.2, R10.13
    - /api/v1/insights/recommendations      # R8.2
    - /api/v1/poolers                       # R6; PoolerView is already defined (R8.2 reuses it)
    - /api/v1/poolers/{namespace}/{name}
    - /api/v1/events                        # R8.2
    - /api/v1/explain                       # R8.2
    - /api/v1/search                        # R8.2 (?q=)
  # r4.5-actions is the second live key, and it exists because R8.2's catalogue is
  # not the whole route set. R4.5 (requirements.md:330) names
  # `POST /api/v1/sessions/{pid}/terminate` — `pg_terminate_backend(pid)`, behind
  # R12.8's gate — and that path is not one of the twenty R8.2 lists at
  # requirements.md:374, so filing it under r8.2-catalogue would attribute it to a
  # requirement that does not name it. That is the same error the note above just
  # corrected on /api/v1/active-queries, one direction round: there an implemented
  # route carried an id belonging to a different feature; here a planned route would
  # be filed in a catalogue that never asked for it. The manifest's keys are
  # per-requirement-set (r8.2-catalogue, r8.3-promql-pair, r8.11-batched-series,
  # r8.7-debug), so a route named by R4.5 gets an r4.5 key.
  #
  # It is planned, not implemented: R4.5's own text requires more than a handler —
  # "requiring a confirmed UI action, audited to a log line with actor and target,
  # and refused on a replica" — and all three of those are Phase 6a's remaining
  # scope. R4.1's route is live without it: the `Action` column R4.1 requires renders
  # `disabled` (active_queries.go's actionFor) precisely so the column is not blank
  # while the action behind it is unbuilt.
  r4.5-actions:
    - /api/v1/sessions/{pid}/terminate      # R4.5, R12.8 (POST)
  # r8.3-promql-pair was the second entry here: /api/v1/metrics/query and
  # /api/v1/metrics/system, GET|POST each. Both moved up to `paths` when R8.3
  # landed, so the entry is gone rather than marked — a planned-path that is
  # implemented is a second name for a route that exists, and R14.7 counts one.
  # The old note ended "it is enumerated here once Phase 2 names them", which
  # misread the requirement: R8.3 asks for the catalogue to be enumerated *in
  # this document*, now, and the enumeration is what makes "we answer from our
  # own store" a contract instead of a cache dump. It now lives on each path as
  # `x-promql-catalogue`, and TestCatalogueMatchesOpenAPIDocument (plus
  # scripts/check-openapi.py) enforces the two lists against the table in
  # internal/api/promql_catalogue.go.
  # r8.11-batched-series was the third entry here: GET
  # /api/v1/insights/queries/series?fingerprints=a,b,c&range=…, the one response
  # that answers the per-minute series for up to 50 fingerprints so R10.6's
  # per-row sparklines do not cost one request per row inside R10.14's 1.5 s
  # page-load budget. It moved up to `paths` in the commit that added the
  # handler (internal/api/series.go), so the entry is gone rather than marked —
  # the rule r8.3-promql-pairs states above: a planned-path that is implemented
  # is a second name for a route that exists, and R14.7 counts one.
  # r8.7-debug was the fourth entry here: /debug/pprof/ and its four sub-paths.
  # server.go registered them in Phase 1a and they moved up to `paths` in the
  # same commit, so R8.7's surface is now entirely in code and nothing under
  # that heading is planned. (The old note also had the auth story backwards —
  # pprof is in auth.go's GroupAPI and follows --auth, per R8.9.)
