# pgsql-insights REST API (R8.1)
#
# R8.1 asks for "a committed OpenAPI document (api/openapi.yaml) generated from
# the handlers and checked in CI". Two words in that sentence are in tension,
# and the resolution is recorded here rather than left to the next reader:
#
#   * "generated from the handlers" — the handlers were Phase 1a's. This file
#     predates them (it was authored from the frozen dto so Phase 1b had a
#     contract to build against), and it is still hand-written: the stdlib has
#     no OpenAPI generator, and the routes are registered as http.ServeMux
#     patterns over plain handlers, which a generator would have to infer from.
#     Every route `internal/api/server.go`'s `Handler()` registers now appears
#     in `paths` — that is R14.7's requirement, and it is the property a
#     generator would check rather than the source of it.
#   * "the contract is frozen" — internal/api/dto/clusters.go (commit 9214534)
#     is the normative source for /api/v1/clusters, mirrored tag-for-tag in
#     web/src/api/types.ts and byte-checked by testdata/api/clusters.json via
#     TestGoldenFixtureIsCanonical (R16.8). The handler is now a third consumer
#     of that fixture: TestClustersServesTheFrozenFixture byte-compares this
#     route's response body to the same file, so the document, the struct and
#     the served JSON cannot drift apart quietly.
#
# The schemas stay per-resource (components.schemas.*, referenced by $ref) so
# that generating, extending or splitting the document never requires rewriting
# it. x-status on each path says whether it is in code; x-planned-paths at the
# bottom lists the routes R8.2 still names that are not in code yet (R8.3's
# pair and R8.11's batched series moved up to `paths` and both entries are
# retired below), so promoting one into `paths` is a one-entry edit rather than
# a restructure.
#
# YAML note: every scalar whose text contains ": " (or starts with a backtick)
# is double-quoted here. Seven were not at HEAD — two because their text
# contains a colon-space (`servers[0].description`, whose "No host: the binary
# serves both." reads as a nested mapping, and
# `ClusterView.properties.currentPrimary.description`), five because a leading
# backtick is a reserved YAML indicator. All seven made the whole document
# unparseable by a YAML loader, so any validator run over this file failed on
# syntax before it could check the contract.
#
# R8.1's "checked in CI" half is now `scripts/check-openapi.py`, run by
# `make openapi-check` and by a step in ci.yml's lint job next to the spec-parity
# matrix. It is not a `yaml.safe_load` one-liner: the parse is the cheap half,
# and the seven bugs above were all *syntax*, which a load finds and a review
# does not, but a load says nothing about whether a documented path has an
# operationId, whether a $ref points at something, or whether a `required` field
# exists in `properties`. The script checks those, plus the house rules this file
# sets for itself (every path declares x-status; every x-planned-paths entry is
# a route; the two x-promql-catalogue lists are disjoint and well-formed).

openapi: 3.0.3

info:
  title: pgsql-insights API
  version: 0.1.0
  description: |
    The REST surface of pgsql-insights: CloudNativePG cluster inventory and
    PostgreSQL query/system insights for a whole fleet, served by the same
    binary that serves the web UI (R8.6).

    **Normative sources.** The JSON shapes are defined in Go at
    `internal/api/dto/clusters.go` (frozen at commit `9214534`), mirrored in
    TypeScript at `web/src/api/types.ts`, and byte-checked against
    `testdata/api/clusters.json` by `TestGoldenFixtureIsCanonical` (R16.8).
    This document is a projection of that contract, not a fourth copy of it:
    a field added to the Go struct without appearing here is a defect, and
    vice versa.

    **Envelope.** Every list endpoint returns `{data, meta}` (R8.4). `meta`
    carries the partial-render contract (R10.22): `meta.failed[]` names the
    namespaces whose discovery pass errored and `meta.loading[]` the ones still
    in flight, so a page showing 3 of 4 clusters says so instead of looking
    plausibly complete. A schema that omitted `meta.failed` would understate
    the contract, which is why `FleetEnvelope` below spells it out rather than
    reducing the envelope to `{data, meta:{total}}`.

    **Errors.** Every error, at every status code, is `ErrorBody` (R8.5) —
    modelled on the CNPG instance-manager envelope so the ecosystem's
    error-reading code transfers unchanged. The `code` enum is the same one
    `meta.failed[].code` uses; there is no second vocabulary.
  contact:
    name: pgsql-insights
    url: https://github.com/frankellis/pgsql-insights
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

# R8.1's versioned prefix. There is one server: the API is same-origin with the
# UI (R8.6), so a relative URL is the only correct entry — an absolute host
# here would be wrong in every environment it gets deployed to.
servers:
  - url: /
    description: "Same-origin with the SPA (R8.6). No host: the binary serves both."

# R8.8: / and /api/v1/* require a bearer token by default. The probe surface
# opts out per-path below (`security: []`), which is how --auth-metrics=none
# lets Prometheus scrape without holding a token (R8.9).
security:
  - bearerAuth: []

tags:
  - name: clusters
    description: CloudNativePG cluster inventory (R8.2's `/clusters`).
  - name: metrics
    description: |
      R8.3's PromQL pair — `/api/v1/metrics/query` and `/api/v1/metrics/system`,
      each GET|POST, mirroring the Cloud SQL MCP's get_query_metrics and
      get_system_metrics. Not the Prometheus exposition (that is `probes`): this
      is the query surface, proxied to a Prometheus when one is configured and
      served from the named catalogue otherwise.
  - name: insights
    description: |
      R8.2's query-insights surface beyond the PromQL pair. In code now: the
      batched per-minute series route (R8.11,
      `/api/v1/insights/queries/series`). The rest of R8.2's list — the
      per-fingerprint detail, wait-events, databases, users, tags — is still in
      `x-planned-paths`.
  - name: build
    description: Build metadata (R11.3).
  - name: probes
    description: "Liveness, readiness, Prometheus scrape and pprof endpoints (R8.7)."
  - name: ui
    description: The embedded SPA (R8.6, R10.1).

paths:
  /api/v1/clusters:
    get:
      tags: [clusters]
      operationId: listClusters
      summary: List clusters in the fleet
      description: |
        The fleet inventory (R8.2's `/clusters`), rendered from the frozen
        `dto.ClusterView` contract.

        In code now (`Server.handleClusters`, `internal/api/clusters.go`). The
        contract was frozen at 9214534 — the Go type first, the handler after —
        so Phase 1b could build the Fleet page against it in parallel. The
        handler is now the third consumer of `testdata/api/clusters.json`
        (R16.8) alongside the DTO test and the SPA's Vitest fixture, and
        `TestClustersServesTheFrozenFixture` byte-compares this route's body to
        that file, so a field dropped, renamed or reordered here fails CI.

        R8.7's single readiness signal gates this route: an unready process
        answers 503 `NotReady` here rather than 200 with an empty `data`,
        because "the fleet is empty" and "I have not collected yet" are
        different facts and a 200 cannot express the second. The same value
        answers `/readyz`, so the probe and the API cannot disagree — which is
        what R8.9's unconditional probe exemption makes load-bearing.
      x-status: implemented
      parameters:
        - $ref: '#/components/parameters/Namespace'
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/DB'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of clusters, plus the envelope metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetEnvelope'
              example:
                data:
                  - namespace: postgres
                    name: onepg
                    phase: Cluster in healthy state
                    instances: 3
                    readyInstances: 3
                    servingInstances: 3
                    currentPrimary: onepg-1
                    pgMajor: 17
                    pgImage: ghcr.io/cloudnative-pg/postgresql:17.6
                    pgVersionDetail: "17.6"
                    instanceList:
                      - name: onepg-1
                        role: primary
                        node: k3s-control-1
                        ready: true
                        serving: true
                        phase: Running
                        containerStatus: running
                        restartCount: 0
                        podIP: 10.42.1.31
                        endpoints:
                          postgres: 10.42.1.31:5432
                          metrics: https://10.42.1.31:9187/metrics
                          status: https://10.42.1.31:8000/status
                    conditions: []
                    certificates:
                      clientCA: onepg-client-ca-1735689600
                      serverTLSSecret: onepg-server
                      replicationTLSSecret: onepg-replication
                      expirations:
                        onepg-client-ca-1735689600: "2026-12-22T08:39:48Z"
                        onepg-server: "2026-12-22T08:39:48Z"
                    pvcs:
                      - name: onepg-1
                        instance: onepg-1
                        size: 1Gi
                        storageClass: local-path
                        accessModes: [ReadWriteOnce]
                        phase: Bound
                    services:
                      - name: onepg-rw
                        type: ClusterIP
                        role: rw
                        ports:
                          - name: postgres
                            protocol: TCP
                            port: 5432
                            targetPort: "5432"
                        clusterIP: 10.43.10.11
                    poolers: []
                    credentialSource: secret-cluster
                    createdAt: "2025-12-22T08:00:00Z"
                meta:
                  total: 1
                  truncated: false
                  generatedAt: "2026-11-21T09:12:03Z"
                  nextCursor: ""
                  failed: []
                  loading: []
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/NotReady'

  /api/v1/version:
    get:
      tags: [build]
      operationId: getVersion
      summary: Build metadata of the running binary
      description: |
        R11.3's version/commit endpoint. In code today (`Server.handleVersion`).
        The same values are exported as the `pgsi_build_info` metric (R9.8) so
        a fleet can be audited from Prometheus without calling the API.
      x-status: implemented
      responses:
        '200':
          description: The build's version and commit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
              example:
                version: 0.1.0
                # D6: the full 40-character SHA, not the 7-character short form
                # the first published binary carried. The image *tag* stays
                # 7 characters (R11.3); this field and the OCI revision label
                # carry the whole thing.
                commit: "92145342c9722b2975777ff368e87a6de67aa142"
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # R8.3's PromQL pair. Two routes, one request object, one response object.
  #
  # The shape is copied from the Cloud SQL MCP's get_query_metrics /
  # get_system_metrics — `{parent, resource, promqlQuery, startTime, endTime}`
  # in, `{promqlResult}` out — because a client written against Google's MCP can
  # be repointed at pgsi by changing a base URL. That portability is the whole
  # reason R8.3 exists as its own requirement instead of being part of R8.2's
  # route table; inventing a local shape would have been a nicer API and no
  # longer a compatible one.
  #
  # Three answer modes, tried in order (see internal/api/promql.go):
  #   1. proxy     — --prometheus-url set: the query goes to /api/v1/query or
  #                  /api/v1/query_range and the upstream result is returned
  #                  byte-for-byte, so a proxied answer is Prometheus's answer.
  #   2. catalogue — no Prometheus: §3.4 keeps raw samples out of SQLite and we
  #                  ship no PromQL evaluator, so the only honest answer is the
  #                  fixed table in promql_catalogue.go, serialised in Prometheus
  #                  result form. R8.3 requires that table to be *enumerated in
  #                  this document*, which is what x-promql-catalogue below is
  #                  for; TestCatalogueMatchesOpenAPIDocument compares it against
  #                  the table the handlers use, so the list cannot be prose.
  #   3. error     — a query in neither mode: 404 error.code=PromQLUnavailable.
  #                  404 and not 400 because the request is well-formed — R8.5
  #                  gives "malformed" and "I cannot serve this" different codes,
  #                  so they get different statuses.
  # ---------------------------------------------------------------------------
  /api/v1/metrics/query:
    x-promql-catalogue:
      - aggregate.cache_hit_ratio
      - aggregate.execution_time
      - aggregate.lock_time
      - aggregate.rows
      - aggregate.shared_blocks_hit
      - aggregate.shared_blocks_read
      - perquery.execution_time
      - perquery.lock_time
      - perquery.rows
      - perquery.shared_blocks_hit
      - perquery.shared_blocks_read
    get:
      tags: [metrics]
      operationId: getQueryMetrics
      summary: Query insights for a cluster (R8.3)
      description: |
        The MCP's `get_query_metrics`: R9.4's aggregate family and R9.5's
        per-query (top-N) rollups, plus the derived cache-hit ratio.
        `promqlQuery` is a catalogue name from `x-promql-catalogue` above, or
        the exact PromQL behind one; anything else is 404 `PromQLUnavailable`
        unless a Prometheus is configured to evaluate it.
      x-status: implemented
      parameters:
        - $ref: '#/components/parameters/PromQLQuery'
        - $ref: '#/components/parameters/Parent'
        - $ref: '#/components/parameters/Resource'
        - $ref: '#/components/parameters/StartTime'
        - $ref: '#/components/parameters/EndTime'
      responses:
        '200':
          description: The result, in Prometheus response form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromQLQueryResponse'
              example:
                promqlResult:
                  resultType: vector
                  result:
                    - metric:
                        namespace: postgres
                        cluster: onepg
                        datname: appdb
                        usename: app
                      value: [1764209523.000, "0.4182"]
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PromQLUnavailable'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags: [metrics]
      operationId: postQueryMetrics
      summary: Query insights for a cluster (R8.3)
      description: |
        The same route as `get`, with the request in the body. The MCP is
        POST-only; R8.3 specifies GET as well so a browser, a `curl` one-liner
        and a Prometheus-style explore box can all reach it. GET accepts
        Prometheus' own parameter spellings (`query`, `start`, `end`) as aliases
        of `promqlQuery`, `startTime`, `endTime` — one line each, and the
        single most likely client for these routes already speaks that spelling.
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromQLQueryRequest'
      responses:
        '200':
          description: The result, in Prometheus response form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromQLQueryResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PromQLUnavailable'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/v1/metrics/system:
    x-promql-catalogue:
      - system.backends_by_application_name
      - system.backends_by_state
      - system.blks_hit
      - system.blks_read
      - system.checkpoints_requested
      - system.checkpoints_timed
      - system.cnpg_pg_is_in_recovery
      - system.cnpg_pg_replication_lag_seconds
      - system.cnpg_pg_status
      - system.database_size_bytes
      - system.deadlocks
      - system.mxid_age
      - system.temp_bytes
      - system.temp_files
      - system.tps
      - system.tuples_deleted
      - system.tuples_fetched
      - system.tuples_inserted
      - system.tuples_returned
      - system.tuples_updated
      - system.txid_age
      - system.wal_generated_bytes
      - system.wal_size_bytes
      - system.xact_commit
      - system.xact_rollback
    get:
      tags: [metrics]
      operationId: getSystemMetrics
      summary: System insights for a cluster (R8.3)
      description: |
        The MCP's `get_system_metrics`: R9.7's system family, which is the full
        R5.2 DB metric set plus the parsed `cnpg_*` values re-exported under
        `pgsi_` so a deployment without CNPG's PodMonitor still sees one
        consistent namespace.
      x-status: implemented
      parameters:
        - $ref: '#/components/parameters/PromQLQuery'
        - $ref: '#/components/parameters/Parent'
        - $ref: '#/components/parameters/Resource'
        - $ref: '#/components/parameters/StartTime'
        - $ref: '#/components/parameters/EndTime'
      responses:
        '200':
          description: The result, in Prometheus response form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromQLQueryResponse'
              example:
                promqlResult:
                  resultType: vector
                  result:
                    - metric:
                        namespace: postgres
                        cluster: onepg
                        pod: onepg-1
                        instance_role: primary
                        datname: appdb
                      value: [1764209523.000, "181542"]
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PromQLUnavailable'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags: [metrics]
      operationId: postSystemMetrics
      summary: System insights for a cluster (R8.3)
      description: |
        The same route as `get`, with the request in the body (see
        `/api/v1/metrics/query`'s `post` for why both verbs exist).
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromQLQueryRequest'
      responses:
        '200':
          description: The result, in Prometheus response form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromQLQueryResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PromQLUnavailable'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/v1/insights/queries/series:
    get:
      tags: [insights]
      operationId: getQuerySeries
      summary: Per-minute series for up to 50 fingerprints in one response
      description: |
        R8.11's batched series endpoint: the per-minute series for every
        fingerprint the request names, in ONE response. The requirement's own
        justification is a request count — without it R10.6's per-row sparklines
        need one request per row, and R10.14's 1.5 s page-load budget forbids 50
        detail calls to render one table — so this route exists to replace those
        50 calls, and its shape (one entry per requested fingerprint inside one
        envelope) follows from that and nothing else.

        Each entry carries all five R9.4 aggregate members per point
        (`executionTimeSeconds`, `rows`, `sharedBlocksHit`,
        `sharedBlocksRead`, `lockTimeSeconds` — the member list in
        `internal/api/promql_catalogue.go`, not a re-invented one). That is why
        there is no `metric=` parameter here: R8.11's signature does not name
        one, and a per-metric fetch would need five requests per page to fill
        one table of sparklines, which is the R10.14 budget spent on the wrong
        thing. The same five points serve R10.7's Query Detail chart.

        The body is `dto.Envelope[QuerySeries]` — R8.4's generic, the one
        `/api/v1/clusters` serves and `web/src/api/types.ts` mirrors (R16.8),
        named `QuerySeriesEnvelope` rather than re-typed. `meta.total` is the
        number of fingerprints requested after de-duplication and
        `meta.truncated` follows the invariant `dto.Meta` states
        (`truncated` ⟺ `len(data) < total`), so a source that answers 40 of 50
        says total 50 / truncated true instead of quietly reporting 40.
        `meta.nextCursor` stays empty: a batch is not a page — the client names
        the set, so there is nothing to page through. R8.10's paging rules govern
        the list routes, not this one; its above-max-is-an-error rule does apply,
        and that is what `fingerprints` says.

        R8.7's single readiness signal gates this route exactly as it gates
        `/api/v1/clusters`: 503 `NotReady` before the first sync rather than 200
        with an empty `data`. The route reads the series store rather than the
        inventory, but readiness is the process's answer about whether it has
        collected anything at all, and one value answers both routes so they
        cannot disagree — which is what R8.9's unconditional probe exemption
        makes load-bearing.
      x-status: implemented
      parameters:
        - $ref: '#/components/parameters/Fingerprints'
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/Namespace'
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/DB'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: One entry per requested fingerprint, plus the envelope metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuerySeriesEnvelope'
              example:
                data:
                  - fingerprint: "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
                    queryid: "8123456789012345678"
                    namespace: postgres
                    cluster: onepg
                    pod: onepg-1
                    instanceRole: primary
                    datname: appdb
                    usename: app
                    points:
                      - timestamp: "2026-11-21T09:11:00Z"
                        executionTimeSeconds: 0.4182
                        rows: 1200
                        sharedBlocksHit: 48200
                        sharedBlocksRead: 12
                        lockTimeSeconds: 0.0031
                      - timestamp: "2026-11-21T09:12:00Z"
                        executionTimeSeconds: 0.3907
                        rows: 1180
                        sharedBlocksHit: 47910
                        sharedBlocksRead: 8
                        lockTimeSeconds: 0.0028
                meta:
                  total: 1
                  truncated: false
                  generatedAt: "2026-11-21T09:12:03Z"
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        # Two 503 bodies in code, one response key in OpenAPI (a path item maps
        # a status code to exactly one response): the readiness gate, which
        # answers NotReady, and a series read that errors, which answers
        # Unavailable. The ref names NotReady because that is the one reachable
        # today — the default source cannot error — and Unavailable becomes the
        # honest answer when Phase 3's store replaces it. R8.5 keeps the two
        # codes apart precisely so "I have no answer yet" and "I asked and the
        # answer did not come" stay distinguishable; collapsing them here is
        # OpenAPI's limit, not the API's.
        '503':
          $ref: '#/components/responses/NotReady'

  /healthz:
    get:
      tags: [probes]
      operationId: getHealthz
      summary: Liveness probe target (R8.7)
      description: |
        In code today (`Server.handleHealthz`). Answers `ok` whenever the
        process is up; it is deliberately not gated on any dependency, because
        a pod whose kube API watch is broken is still alive and restarting it
        would not help.

        `security: []` — R8.9 makes `/healthz` and `/readyz` unconditionally
        auth-exempt, under any value of `--auth` (the earlier wording keyed the
        exemption to `--auth-metrics=none`). kubelet never sends an
        `Authorization` header, so a gated probe is a broken pod rather than a
        preference.
      x-status: implemented
      security: []
      responses:
        '200':
          description: The process is alive.
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /readyz:
    get:
      tags: [probes]
      operationId: getReadyz
      summary: Readiness probe target (R8.7)
      description: |
        In code today (`Server.handleReadyz`, reading `internal/api/readiness.go`).
        R8.7's three clauses, as implemented:

        **(i) one signal, read by both surfaces.** This route and the API's
        R8.5 `ErrNotReady` 503 path read the same `Readiness` value, so there
        is no state where the probe says "ready" while `/api/v1/clusters`
        answers `NotReady`. Before this, `Run()` set a `ready` flag at
        `net.Listen` and the API decided separately — a pod answered 200 with
        an empty fleet, passed its probe, and received Service endpoints for
        data it had not collected. `Server.New` derives the value from the
        configured `Fleet`, which makes the sharing structural rather than a
        convention two handlers can drift apart from.

        **(ii) only the subsystems this process runs.** A server with no fleet
        (D9's reserved `api` role: serve without collecting) has no discovery
        source to wait for, so it is ready once it is listening. Stating the
        general rule now, alongside the discovery case, is what stops the role
        split from having to retrofit it.

        **(iii) up vs correct.** `/healthz` answers whenever the process is
        up; this route answers whether the data behind it is trustworthy.

        `security: []` per R8.9's unconditional probe exemption — which is what
        makes this route load-bearing: with `--auth=token`, a gated `/readyz`
        answers 401 to kubelet and every pod sits permanently NotReady with its
        Service endpoints evicted.
      x-status: implemented
      security: []
      responses:
        '200':
          description: The server is ready to serve.
          content:
            text/plain:
              schema:
                type: string
                example: ready
        '503':
          description: |
            Not ready — the listener is not up yet, discovery has not completed
            its first sync (R8.7), or the server is draining (R13.8). The same
            value the API's `NotReady` 503 reads (R8.7(i)); the *body* differs
            on purpose, since a probe target answers plain text and an API
            route answers the R8.5 envelope.
          content:
            text/plain:
              schema:
                type: string
                example: not ready

  /metrics:
    get:
      tags: [probes]
      operationId: getMetrics
      summary: Prometheus exposition (R9.1, R11.3)
      description: |
        In code today (`Server.handleMetrics`), serving `pgsi_build_info` only.
        The full R9.2–R9.8 catalogue lands in Phase 2; R9.11's PrometheusRule
        in the chart is authored from those names and marked provisional until
        they exist.

        `security: []` — this is R8.9's actual subject: `--auth-metrics=none`
        exists so a Prometheus scrape needs no token while `/` and `/api/v1/*`
        do (R8.8). Serving metrics from the same port as the API, rather than a
        second `--metrics-listen`, is R9.1's requirement.
      x-status: implemented (pgsi_build_info only; the R9.2 catalogue is Phase 2)
      security: []
      responses:
        '200':
          description: Prometheus text exposition format.
          content:
            text/plain; version=0.0.4:
              schema:
                type: string
              example: |
                # HELP pgsi_build_info Build metadata of the running pgsi binary.
                # TYPE pgsi_build_info gauge
                pgsi_build_info{version="0.1.0",commit="92145342c9722b2975777ff368e87a6de67aa142"} 1

  # R8.7's third surface. server.go registers the five paths net/http/pprof
  # defines; each is documented separately because R14.7 counts them as five
  # routes in code, not one. None declares `security:`, so all five inherit the
  # root `bearerAuth` — which is exactly R8.9's ruling that /debug/pprof/*
  # follows --auth: auth.go classifies them as GroupAPI (the group --auth
  # governs), not the always-open GroupProbe the two probes belong to.
  /debug/pprof/:
    get:
      tags: [probes]
      operationId: getPprofIndex
      summary: Go runtime profile index (R8.7)
      description: |
        In code today (`http/pprof.Index`). The index page links the profiles
        below; the sub-paths are registered explicitly rather than by mounting
        a second mux, so the whole route table is readable from `Handler()`.
      x-status: implemented
      responses:
        '200':
          description: HTML index of available profiles.
          content:
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /debug/pprof/cmdline:
    get:
      tags: [probes]
      operationId: getPprofCmdline
      summary: The process command line (R8.7)
      x-status: implemented
      responses:
        '200':
          description: NUL-separated argv.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /debug/pprof/profile:
    get:
      tags: [probes]
      operationId: getPprofProfile
      summary: CPU profile (R8.7)
      description: |
        Blocks for `?seconds=` (default 30) while sampling, so a scrape-style
        client needs a long timeout. R10.14's latency budget does not apply
        here — this route is profiling, not product surface.
      x-status: implemented
      parameters:
        - name: seconds
          in: query
          required: false
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: gzipped protobuf profile.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'

  /debug/pprof/symbol:
    get:
      tags: [probes]
      operationId: getPprofSymbol
      summary: Symbol lookup for a profile (R8.7)
      x-status: implemented
      parameters:
        - name: '[]'
          in: query
          required: false
          description: "Address(es) to resolve."
          schema:
            type: string
      responses:
        '200':
          description: Symbol table.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /debug/pprof/trace:
    get:
      tags: [probes]
      operationId: getPprofTrace
      summary: Execution trace (R8.7)
      x-status: implemented
      parameters:
        - name: seconds
          in: query
          required: false
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Execution trace.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'

  /:
    get:
      tags: [ui]
      operationId: getSPA
      summary: The embedded web UI (R8.6, R10.1)
      description: |
        In code today (`Server.handleSPA`, `internal/api/spa.go`). The SPA is
        embedded with `go:embed` and served from this binary. `GET /` is the
        mux's root pattern, so it answers for every path the API routes do not
        match — which is how R10.16's client-side routes (`/c/<ns>/<name>`)
        resolve to the app shell. A path under the `api` prefix that no route
        matches answers 404 rather than the shell, so a typo in a fetch URL
        surfaces as an error instead of a page that renders empty.

        R8.6 also specifies `--serve-ui=false` for API-only deployments. The
        flag is not implemented yet — the embed is always served — and the gap
        is recorded in IMPLEMENTATION.md §3.7's R8.6 row rather than implied
        away here; it is one bool in `Config` plus one `if` around this
        registration.
      x-status: implemented
      responses:
        '200':
          description: The SPA shell (text/html).
          content:
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

# ---------------------------------------------------------------------------
# Planned routes (R8.2, R8.11) — deliberately NOT under `paths` yet.
#
# R14.7 requires every route *in code* to be documented; these are not in code,
# and putting them in `paths` would make the document claim routes that 404.
# They are listed here so Phase 3/5 extend this file by promoting entries into
# `paths` — one edit per route — instead of restructuring it. The shape of the
# catalogue is fixed by R8.2, so this is a list of names, not a design.
# ---------------------------------------------------------------------------
x-planned-paths:
  r8.2-catalogue:
    - /api/v1/clusters/{namespace}/{name}   # R8.2 single-cluster detail (R10.3)
    - /api/v1/insights/queries              # R8.2, R10.4
    - /api/v1/insights/queries/{fingerprint}
    - /api/v1/insights/queries/{fingerprint}/plans
    - /api/v1/insights/wait-events          # R4, R10.7
    - /api/v1/insights/databases            # R10.8
    - /api/v1/insights/users                # R10.9
    - /api/v1/insights/tags                 # R7, R10.11
    - /api/v1/insights/client-addresses     # R6, R10.12
    - /api/v1/insights/system               # R5, R10.13
    - /api/v1/insights/system/{metric}      # R8.2, R10.13
    - /api/v1/active-queries                # R3.11
    - /api/v1/insights/recommendations      # R8.2
    - /api/v1/poolers                       # R6; PoolerView is already defined (R8.2 reuses it)
    - /api/v1/poolers/{namespace}/{name}
    - /api/v1/events                        # R8.2
    - /api/v1/explain                       # R8.2
    - /api/v1/search                        # R8.2 (?q=)
  # r8.3-promql-pair was the second entry here: /api/v1/metrics/query and
  # /api/v1/metrics/system, GET|POST each. Both moved up to `paths` when R8.3
  # landed, so the entry is gone rather than marked — a planned-path that is
  # implemented is a second name for a route that exists, and R14.7 counts one.
  # The old note ended "it is enumerated here once Phase 2 names them", which
  # misread the requirement: R8.3 asks for the catalogue to be enumerated *in
  # this document*, now, and the enumeration is what makes "we answer from our
  # own store" a contract instead of a cache dump. It now lives on each path as
  # `x-promql-catalogue`, and TestCatalogueMatchesOpenAPIDocument (plus
  # scripts/check-openapi.py) enforces the two lists against the table in
  # internal/api/promql_catalogue.go.
  # r8.11-batched-series was the third entry here: GET
  # /api/v1/insights/queries/series?fingerprints=a,b,c&range=…, the one response
  # that answers the per-minute series for up to 50 fingerprints so R10.6's
  # per-row sparklines do not cost one request per row inside R10.14's 1.5 s
  # page-load budget. It moved up to `paths` in the commit that added the
  # handler (internal/api/series.go), so the entry is gone rather than marked —
  # the rule r8.3-promql-pairs states above: a planned-path that is implemented
  # is a second name for a route that exists, and R14.7 counts one.
  # r8.7-debug was the fourth entry here: /debug/pprof/ and its four sub-paths.
  # server.go registered them in Phase 1a and they moved up to `paths` in the
  # same commit, so R8.7's surface is now entirely in code and nothing under
  # that heading is planned. (The old note also had the auth story backwards —
  # pprof is in auth.go's GroupAPI and follows --auth, per R8.9.)

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        R8.8's `--auth=token` mode: the bearer token from the auth Secret the
        chart mounts at `/etc/pgsi/auth/token`. A missing token answers 401
        with `WWW-Authenticate: Bearer realm="pgsi"`; a wrong one answers 403.
        The distinction lets an SPA tell "not logged in yet" from "the token
        rotated" without probing.

        `--auth=kube-rbac-proxy` replaces this with the `X-Remote-User` /
        `X-Remote-Group` headers the proxy injects, and `--auth=none` removes
        the requirement entirely (R8.8's lab setting).
      bearerFormat: opaque

  # R8.4's parameter set, plus R8.10's cursor, as reusable components so every
  # list endpoint in x-planned-paths references the same definitions instead of
  # restating them and letting them drift.
  parameters:
    Namespace:
      name: namespace
      in: query
      description: |
        Restrict to one namespace (R8.4). The set of namespaces pgsi looks at at
        all is R1.1's allow-list and R12's RBAC; this narrows within it.
      required: false
      schema:
        type: string
    Cluster:
      name: cluster
      in: query
      description: Restrict to one CloudNativePG Cluster (R8.4).
      required: false
      schema:
        type: string
    DB:
      name: db
      in: query
      description: |
        Restrict to one database (R8.4). Meaningful on the query endpoints;
        accepted and ignored on `/clusters`, which is not per-database.
      required: false
      schema:
        type: string
    From:
      name: from
      in: query
      description: Window start, RFC 3339 (R8.4). Endpoints without a time axis ignore it.
      required: false
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: Window end, RFC 3339 (R8.4).
      required: false
      schema:
        type: string
        format: date-time
    Limit:
      name: limit
      in: query
      description: |
        Page size (R8.4). R8.10 fixes the default at 50 and the maximum at 500;
        a value above the maximum is `InvalidRequest`, not a silent clamp, so a
        client that asks for 5000 learns about it instead of getting 500.
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 500
    Sort:
      name: sort
      in: query
      description: |
        Sort key (R8.4). R8.10 requires every sort to carry a stable secondary
        key (`queryid` for query lists, `pid` for sessions) so two consecutive
        pages never overlap or drop a row; the secondary key is implicit and is
        not a separate parameter.
      required: false
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      description: |
        R8.10's pagination cursor: opaque base64 of the last sort key, **not**
        an offset. Clients must treat it as opaque — it encodes the sort key
        plus the secondary key, and the shape is not part of the contract.
        Echoed back as `meta.nextCursor`; empty on the last page.
      required: false
      schema:
        type: string

    # R8.11's batch parameter and R10.15's range vocabulary, as components for
    # the same reason as the R8.4 set above: one definition per parameter, so
    # the route, the parser in series.go and any later insights route that takes
    # a range cannot each have their own idea of what the parameter accepts.
    Fingerprints:
      name: fingerprints
      in: query
      description: |
        R8.11's batch parameter: the comma-separated fingerprints to fetch, at
        most `MaxBatchFingerprints` (50) of them. **Required** on this route —
        the batched endpoint answers the fingerprints you name, so an empty list
        is `InvalidRequest` rather than an empty page. Spaces around commas are
        trimmed and duplicates collapsed, so a hand-written URL and a
        client-generated one ask for the same set. Above 50 the request is
        `InvalidRequest`, not a silent truncation: that is R8.10's rule for a
        limit above its maximum applied to the batch parameter, because a client
        that asks for 80 and gets 50 cannot tell "30 of them have no data" from
        "you were cut off", and keeping those two answers distinguishable is the
        whole reason R8.10 forbids the clamp.
      required: true
      schema:
        type: string
      example: "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
    Range:
      name: range
      in: query
      description: |
        R10.15's time-range vocabulary: `1h`, `6h`, `1d`, `7d`, `30d`, or
        `custom`. A preset is a window, not a resolution — R8.11's bucket is
        fixed at one minute, and R10.15's own wording separates the five presets
        from any step size. `custom` is how R8.4's `from`/`to` pair is reached
        on this route: with `range=custom` both bounds are required and parsed
        by the same RFC 3339 rules the PromQL pair uses, and on a preset they are
        ignored rather than rejected, so a client that sends `range=1h&from=…`
        gets the hour and no error about a parameter that does not apply to it.
      required: false
      schema:
        type: string
        default: 1h
        enum: [1h, 6h, 1d, 7d, 30d, custom]

    # R8.3's request fields, as components so `get` and `post` on both routes
    # describe the same five fields. `post` sends them in the body
    # (PromQLQueryRequest); `get` sends them as query parameters, which is why
    # each one exists in both forms.
    PromQLQuery:
      name: promqlQuery
      in: query
      description: |
        The query. In catalogue mode this is a name from the path's
        `x-promql-catalogue`, or the exact PromQL text behind one (whitespace
        normalised) — `Catalogue.Lookup` accepts both spellings and nothing else,
        because interpreting an arbitrary PromQL string would be the evaluator
        R8.3 says we do not ship. In proxy mode it is any PromQL string.

        `query` is accepted as an alias: Prometheus' own parameter name, and the
        one a Grafana-style client already sends.
      required: true
      schema:
        type: string
      example: aggregate.execution_time
    Parent:
      name: parent
      in: query
      description: |
        The cluster the query is scoped to, in R8.2's addressing:
        `namespaces/<ns>/clusters/<name>` — the MCP's `projects/<p>/instances/<i>`
        with pgsi's two levels. Empty means every cluster the caller can see.

        `namespaces/<ns>` alone is deliberately *not* accepted: dropping
        `/clusters/x` would silently widen a one-cluster query to a whole
        namespace and return a correct-looking answer to the wrong question.
      required: false
      schema:
        type: string
      example: namespaces/postgres/clusters/onepg
    Resource:
      name: resource
      in: query
      description: |
        The MCP's optional sub-resource, spelled here as a comma-separated list of
        R9.3's optional labels: `datname=appdb,usename=app`, or `pooler=rw`.
        Applied as a label filter in catalogue mode; validated and not applied in
        proxy mode, because the forwarded PromQL string carries its own selectors
        and injecting labels into someone else's query is an evaluator again.
      required: false
      schema:
        type: string
      example: datname=appdb,usename=app
    StartTime:
      name: startTime
      in: query
      description: |
        Range start, RFC 3339 (R8.4's rule for every timestamp the API takes, and
        Prometheus' own accepted format). `start` is accepted as an alias.
        Set with `endTime` or not at all: one bound alone is 400, because "a range
        with no end" is not a range and Prometheus has no endpoint for it.
      required: false
      schema:
        type: string
        format: date-time
      example: "2026-11-26T09:00:00Z"
    EndTime:
      name: endTime
      in: query
      description: |
        Range end, RFC 3339. `end` is accepted as an alias. Both bounds present
        means a range query; neither means an instant query.
      required: false
      schema:
        type: string
        format: date-time
      example: "2026-11-26T10:00:00Z"

  responses:
    # R8.5's error body, one entry per code so a path's `responses:` block is
    # three lines of $ref rather than a re-typed schema per status.
    InvalidRequest:
      description: Bad query parameter or body (R8.5 `InvalidRequest`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error:
              code: InvalidRequest
              message: 'invalid limit: 5000 exceeds the maximum of 500 (R8.10)'
              details: []
    Unauthorized:
      description: |
        Missing, malformed *or wrong* credentials (R8.5 `Unauthorized`, R8.8).
        Every 401 carries `WWW-Authenticate: Bearer realm="pgsi"` — the header
        advertises the scheme, so it belongs on "no token" and "wrong token"
        alike and the two are told apart by the message, not by the status.
        R8.8's vocabulary is entirely 401: a bad token proves the caller is not
        who it claims, which is authentication, not authorization.
      headers:
        WWW-Authenticate:
          description: The supported scheme.
          schema:
            type: string
            example: Bearer realm="pgsi"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error:
              code: Unauthorized
              message: missing Authorization header
              details: []
    Forbidden:
      description: |
        Authenticated, but the identity may not see this object (R8.5
        `Forbidden`, R12). 403 is R12's code to emit and R12's alone: a *wrong*
        token is 401 `Unauthorized` (R8.8), because "you are not who you say"
        and "you are allowed to be here but not to read this cluster" are
        different answers, and a client that cannot tell them apart cannot
        decide whether to re-authenticate or to hide the row. R12's
        per-namespace authorization is Phase 5+; until it lands, nothing in the
        API answers 403.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error:
              code: Forbidden
              message: namespace "finance" is not visible to this identity (R12)
              details: []
    NotReady:
      description: |
        Discovery has not produced an inventory sync yet (R8.5 `NotReady`,
        R8.7). Distinct from `Unavailable`: the server is up and knows it does
        not yet have an answer, which is why `/api/v1/clusters` returns this
        rather than an empty `data` array that looks like an empty fleet.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error:
              code: NotReady
              message: discovery has not completed its first sync
              details: []
    Unavailable:
      description: |
        A dependency is down or unreachable (R8.5 `Unavailable`): the store, the
        kube API, or — since R8.3 — the Prometheus a proxy-mode query was
        forwarded to. Distinct from `NotReady`, which is "I am up and I know I
        have no answer yet"; `Unavailable` is "I asked, and the answer did not
        come". A proxied query that upstream answers 400/422 is *not* this: that
        is `InvalidRequest` with the upstream message echoed, because the caller's
        PromQL is what upstream rejected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error:
              code: Unavailable
              message: 'prometheus at http://prometheus.monitoring:9090 is unreachable: dial tcp 10.43.7.19:9090: connect: connection refused'
              details: []
    PromQLUnavailable:
      description: |
        R8.3's own code: the query is not in the named catalogue and no Prometheus
        is configured to evaluate it. 404 and not 400 — the request is
        well-formed, the PromQL string is fine, the server simply cannot serve it,
        and R8.5 gives "malformed request" and "not something I can answer"
        different codes precisely so a client can tell *fix the request* from *ask
        for something else*. The message names the endpoint it was asked about; a
        query catalogued on the other route says so too, which turns a bare 404
        into one a client can act on.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error:
              code: PromQLUnavailable
              message: 'query "sum(node_load1)" is not in the /api/v1/metrics/query catalogue and no Prometheus is configured to evaluate it (R8.3)'
              details: []

  schemas:

    # ---- Envelope (R8.4) ---------------------------------------------------

    FleetEnvelope:
      type: object
      description: |
        `dto.Envelope[ClusterView]` — the concrete projection of the Go generic
        `Envelope[T any]` for the clusters endpoint. OpenAPI 3.0 has no
        composition mechanism for generics, so each resource's envelope is a
        named schema wrapping the shared `Meta`; `FleetEnvelope` is the one for
        `/api/v1/clusters`, and Phase 3 adds one per resource the same way.

        `data` is always present, even when empty: an empty fleet and a missing
        field are different answers, and R10.22's banner is built from `meta`
        precisely so the two are not conflated.
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ClusterView'
        meta:
          $ref: '#/components/schemas/Meta'

    Meta:
      type: object
      description: |
        Pagination and partial-render metadata for every list endpoint (R8.4,
        extended by R10.22, ruled on in IMPLEMENTATION.md D18). `total` is
        R8.10's **pre-cut count** — matching rows across all pages — which is
        exactly what `truncated` is defined against
        (`truncated ⟺ len(data) < total`).
        It is neither a count of what this response carries nor an "attempted"
        count. The v0.3.0 wording here said "served", which collides with
        R8.10 on any truncated page: with 120 matching and `limit=50`,
        "served" is 50 and R8.10's total is 120, so two documents assigned
        different numbers to one field. The `attempted = total + len(failed) +
        len(loading)` that wording implied is deleted outright — it adds *rows*
        to *namespaces*, and a namespace yields N clusters, so no arithmetic
        over `total` recovers an attempted-cluster count. R10.22's banner
        therefore prints `data.length`, never `meta.total`.
      required: [total, truncated, generatedAt]
      properties:
        total:
          type: integer
          description: |
            Matching objects across all pages, before the page was cut (R8.10,
            per D18). On a truncated page this is larger than `len(data)`; it
            is not the size of `data`, and the UI must not present it as the
            number of clusters rendered.
        truncated:
          type: boolean
          description: |
            True when `data` holds fewer objects than `total`, i.e. another page
            exists (R8.4). Purely about pagination: a page can be complete and
            still have a failed namespace, and a truncated page can have none.
        generatedAt:
          type: string
          format: date-time
          description: |
            When this inventory snapshot was produced (R8.4). The UI renders it
            as "inventory age", which is how a stale discovery cache becomes
            visible instead of looking like an empty cluster list.
        nextCursor:
          type: string
          description: |
            Opaque cursor for the following page (R8.10). Absent/empty on the
            last page.
        failed:
          type: array
          description: |
            R10.22's partial-render contract: the namespaces whose discovery pass
            errored. The unit is the namespace, not the cluster, because that is
            the unit discovery fails at (R1.1's allow-list and R12's RBAC both
            scope by namespace) — a failed namespace contributes no ClusterView
            to hang an `error` field on.
          items:
            $ref: '#/components/schemas/NamespaceFailure'
        loading:
          type: array
          description: |
            Namespaces whose first discovery pass is still in flight (R10.22).
            Distinguished from `failed` because "still working" and "errored"
            render differently in the banner.
          items:
            type: string

    NamespaceFailure:
      type: object
      description: |
        One namespace whose discovery pass errored (R10.22). `code` reuses the
        R8.5 enum rather than minting a second vocabulary, so the UI's existing
        switch on error codes covers partial failures too.
      required: [namespace, code, message]
      properties:
        namespace:
          type: string
          description: The namespace that failed to list/watch.
        code:
          type: string
          description: |
            From the R8.5 enum — typically `Forbidden` (the ServiceAccount cannot
            read that namespace, R12.3), `Unavailable` (kube API timeout) or
            `Internal`.
          enum:
            - InvalidRequest
            - Unauthorized
            - Forbidden
            - NotFound
            - MethodNotAllowed
            - NotReady
            - Unavailable
            - PromQLUnavailable
            - Unsupported
            - Internal
        message:
          type: string
          description: "The underlying error text, e.g. `cannot list clusters: forbidden`."
        lastSuccessTime:
          type: string
          format: date-time
          nullable: true
          description: |
            When this namespace last synced successfully, so the UI can say
            "stale since 09:12" rather than only "failed". Null means it has
            never synced — the Go field is a `*time.Time` because encoding/json's
            `omitempty` never fires on a struct value, and a bare `time.Time`
            would emit `0001-01-01T00:00:00Z` for "never" instead of omitting it.

    # ---- Errors (R8.5) -----------------------------------------------------

    ErrorBody:
      type: object
      description: |
        The single error shape for every endpoint (R8.5), modelled on the CNPG
        instance-manager envelope so the ecosystem's error-reading code
        transfers unchanged.
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
          description: |
            The R8.5 error-code enum. Documented as an enum here (and as Go
            constants in `dto`) because R8.5 requires the codes be documented
            rather than being string literals at each call site.
          enum:
            - InvalidRequest    # bad query parameter or body
            - Unauthorized      # missing/bad token (R8.8)
            - Forbidden         # token lacks scope for the object (R12)
            - NotFound          # no such cluster/pooler/query
            - MethodNotAllowed  # route exists, verb does not
            - NotReady          # discovery has not synced yet (R8.7)
            - Unavailable       # dependency down (store, kube API)
            - PromQLUnavailable # R8.3: query outside the named catalogue
            - Unsupported       # feature gated off by config
            - Internal          # anything else
        message:
          type: string
          description: A human-readable, single-sentence explanation.
        details:
          type: array
          description: |
            Per-item messages (validation failures, per-collector errors).
            **Always present, possibly empty**, so clients never branch on
            whether the array exists. `dto.NewError` normalises a nil slice to
            `[]` because a nil marshals to `null` — a different JSON type from
            `[]`, which would break exactly that guarantee.
          items:
            type: string

    # ---- Cluster (R1.5's field list, verbatim and in order) ----------------

    ClusterView:
      type: object
      description: |
        One CloudNativePG Cluster as `GET /api/v1/clusters` renders it. The
        field set is R1.5's list, verbatim and in order.

        The R10.4 metric columns (TPS, p95 latency, connections %, disk %) and
        the "top finding" column are deliberately absent: they are Phase 5's
        R9 contract and Phase 6's insight engine, and the UI derives both the
        metric values and the healthy/degraded/down rollup from the counts
        below rather than reading a server-side judgement.
      required:
        - namespace
        - name
        - phase
        - instances
        - readyInstances
        - servingInstances
        - pgMajor
        - instanceList
        - conditions
        - certificates
        - pvcs
        - services
        - poolers
        - credentialSource
        - createdAt
      properties:
        namespace:
          type: string
        name:
          type: string
        phase:
          type: string
          description: |
            CNPG's `status.phase` passed through as the human string CNPG writes
            ("Cluster in healthy state"), not an enum we invent (R1.5). The UI
            renders the string verbatim.
        phaseReason:
          type: string
          description: CNPG's `status.phaseReason`, e.g. "Not enough disk space".
        instances:
          type: integer
          description: Desired instance count (`spec.instances`) — CNPG's own number.
        readyInstances:
          type: integer
          description: Pods Kubernetes reports ready — also CNPG's own number.
        servingInstances:
          type: integer
          description: |
            R1.2's correction: pods whose `postgres` container is actually
            running. Not the same as `readyInstances` — a pod can be Running
            with postgres in CrashLoopBackOff (live-probe.md §6, Finding 9), so
            a collector that renders `instances` as health shows a green cluster
            that is fully down.
        currentPrimary:
          type: string
          description: "`status.currentPrimary`, empty while no pod is elected."
        pgMajor:
          type: integer
          nullable: true
          description: |
            The PostgreSQL major version resolved per R1.3: the
            `app.kubernetes.io/version` pod label first, SQL
            `current_setting('server_version_num')` as the fallback, cached per
            cluster. **Null when neither source has answered yet** — a `0` would
            render as a real version in the Fleet table's "PG major" column, and
            R1.3's whole point is that the answer is sometimes not known yet
            (R10.22, R1.3).
        pgImage:
          type: string
          description: |
            The image the CR reports (`status.image`, falling back to
            `spec.imageName`) — kept because the label's "17" cannot express
            17.11, and R2.4's matrix keys off the exact minor.
        pgVersionDetail:
          type: string
          description: Full version string when known ("17.11"). Empty when unresolved.
        instanceList:
          type: array
          description: |
            R1.5's "instance list with roles, node names and ready flags".
            Named `instanceList` because `instances` above is the count — which
            is what both CNPG's `kubectl get` column and R1.5 call "instances".
          items:
            $ref: '#/components/schemas/InstanceView'
        conditions:
          type: array
          description: "`status.conditions` (R1.5)."
          items:
            $ref: '#/components/schemas/ConditionView'
        certificates:
          $ref: '#/components/schemas/CertificateExpirations'
        pvcs:
          type: array
          description: R1.5's "PVC list".
          items:
            $ref: '#/components/schemas/PVCView'
        services:
          type: array
          description: R1.5's "services" (the `-rw`/`-ro`/`-r` Services plus pooler ones).
          items:
            $ref: '#/components/schemas/ServiceView'
        poolers:
          type: array
          description: R1.5's "any Poolers"; discovery rule in R1.4.
          items:
            $ref: '#/components/schemas/PoolerView'
        credentialSource:
          type: string
          description: |
            Which of R1.8's four precedence levels supplied this cluster's
            Postgres credentials. R1.8 requires the SQL collectors to report
            `unconfigured` rather than fail when it is `none` while non-SQL
            collectors keep working, so the resolution has to be observable
            through the API — this is the field R1.6's zero-prerequisite
            acceptance reads.
          enum:
            - secret-flag   # --credential-secret
            - secret-cluster # <cluster>-app, the CNPG convention
            - configured    # the single configured credential
            - none          # unconfigured: SQL collectors report it (R1.8)
        createdAt:
          type: string
          format: date-time
          description: |
            `metadata.creationTimestamp`. Not in R1.5's list; the Fleet table
            shows cluster age, and adding it after the contract freezes is a
            change the frontend has to react to, so it is here from the start.

    InstanceView:
      type: object
      description: One instance pod of a Cluster (R1.2, R1.5).
      required: [name, ready, serving, phase, containerStatus, restartCount, endpoints]
      properties:
        name:
          type: string
        role:
          type: string
          description: |
            `cnpg.io/instanceRole`: primary | replica | unhealthy, read per
            R1.2 and falling back to the deprecated `role` label when only that
            is present. Empty when the pod carries neither, which is the normal
            state of a pod not yet assigned a role.
          enum: [primary, replica, unhealthy, ""]
        node:
          type: string
          description: "`spec.nodeName`, empty while the pod is unscheduled (R1.5's \"node names\")."
        ready:
          type: boolean
          description: The pod's `ContainersReady` condition (R1.5's "ready flags").
        serving:
          type: boolean
          description: |
            True only when the `postgres` container is running. Not the same as
            `ready`: a pod can be Running with postgres in CrashLoopBackOff,
            which is exactly the case R1.2 was written against.
        phase:
          type: string
          description: The pod phase.
          enum: [Running, Pending, Succeeded, Failed, Unknown]
        containerStatus:
          type: string
          description: |
            The `postgres` container's state verbatim: "running",
            "CrashLoopBackOff", "PodInitializing", "ImagePullBackOff",
            "Terminating". This is the field that makes R1.2's crash-loop case
            legible in the UI instead of just a wrong count.
        restartCount:
          type: integer
          description: The postgres container's `restartCount`.
        podIP:
          type: string
          description: |
            `status.podIP`, empty while the pod has no address. R1.10's direct
            transport needs it; `endpoints` is built from it.
        fenced:
          type: boolean
          description: |
            True when the pod is listed in the Cluster's `cnpg.io/fencedInstances`
            annotation — a pod CNPG is deliberately keeping out of the topology,
            which the UI must not render as a healthy member.
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: The pod's `startTime`; null while Pending.
        endpoints:
          $ref: '#/components/schemas/InstanceEndpoints'

    InstanceEndpoints:
      type: object
      description: |
        The R1.10 per-port transport table rendered for one instance. Part of
        the contract because the scheme is per-port data, not a guess: probing
        `http://pod:8000` reports the status endpoint as down (live-probe.md
        §4, Finding 6). Every field is empty when the pod has no address to
        build one from.
      properties:
        postgres:
          type: string
          description: |
            The 5432 wire address ("10.42.2.39:5432"), **not** an HTTP URL —
            R1.10 types that port as the postgres protocol with password/TLS auth.
        metrics:
          type: string
          description: |
            9187, the instance-manager Prometheus endpoint. HTTP, and HTTPS only
            when `spec.monitoring.tls.enabled` (R1.10).
        status:
          type: string
          description: |
            8000, the instance-manager API. HTTPS always (R1.10/F6) — an HTTP
            probe of this port returns "Client sent an HTTP request to an HTTPS
            server."
        local:
          type: string
          description: |
            8010, the pod-local instance-manager endpoint that is not reachable
            from outside the pod (R1.10). Populated only when the probe path is
            exec/port-forward rather than a direct URL.

    ConditionView:
      type: object
      description: One entry of a Cluster's `status.conditions` (R1.5).
      required: [type, status, lastTransitionTime]
      properties:
        type:
          type: string
        status:
          type: string
          enum: [True, False, Unknown]
        reason:
          type: string
        message:
          type: string
        lastTransitionTime:
          type: string
          format: date-time
          description: CNPG's `lastTransitionTime`.

    CertificateExpirations:
      type: object
      description: |
        Renders `status.certificates` (R1.5's "cert expirations"). CNPG reports
        expirations as a map of secret name to timestamp; the map is re-emitted
        rather than flattened to three fields, because a cluster with extra
        secrets (a custom server cert, a pooler client cert) has more than three
        and the UI should show all of them.
      required: [expirations]
      properties:
        clientCA:
          type: string
          description: The client CA secret name CNPG records, empty when custom.
        serverTLSSecret:
          type: string
        replicationTLSSecret:
          type: string
        expirations:
          type: object
          description: |
            Maps secret name to the certificate's `notAfter`, normalised to
            RFC 3339 UTC. CNPG writes these as Go's default `time.String()`
            format ("2026-12-22 08:39:48 +0000 UTC"); the discovery layer parses
            and re-emits RFC 3339 so the UI never has to parse two time formats.
          additionalProperties:
            type: string
          example:
            onepg-client-ca-1735689600: "2026-12-22T08:39:48Z"
            onepg-server: "2026-12-22T08:39:48Z"

    PVCView:
      type: object
      description: |
        One PVC of a Cluster (R1.5's "PVC list"). CNPG names a PVC exactly after
        its instance, but `instance` is carried explicitly rather than derived so
        a renamed or orphaned volume still renders against the right row.
      required: [name]
      properties:
        name:
          type: string
        instance:
          type: string
        size:
          type: string
          example: 1Gi
        storageClass:
          type: string
        accessModes:
          type: array
          items:
            type: string
          example: [ReadWriteOnce]
        phase:
          type: string
          enum: [Bound, Pending, Lost, ""]

    ServiceView:
      type: object
      description: |
        One Service of a Cluster (R1.5's "services"). CNPG creates `-rw`, `-ro`
        and `-r` per cluster plus one per Pooler.
      required: [name]
      properties:
        name:
          type: string
        type:
          type: string
          description: ClusterIP | LoadBalancer | NodePort.
          enum: [ClusterIP, LoadBalancer, NodePort, ""]
        role:
          type: string
          description: |
            rw | ro | r | pooler, read from the name suffix: CNPG's service role
            label differs between 1.29 and 1.30, so the suffix is the stable read
            and the label is not.
          enum: [rw, ro, r, pooler, ""]
        ports:
          type: array
          items:
            $ref: '#/components/schemas/ServicePort'
        clusterIP:
          type: string
          description: "`spec.clusterIP` (\"None\" for headless services)."

    ServicePort:
      type: object
      required: [port]
      properties:
        name:
          type: string
        protocol:
          type: string
          example: TCP
        port:
          type: integer
        targetPort:
          type: string
          description: |
            Kubernetes' `IntOrString` normalised to a string: "5432" for a
            numeric port, "pgbouncer" for a named one.

    PoolerView:
      type: object
      description: |
        A pgbouncer Pooler discovered per R1.4 and attached to its Cluster
        through `spec.cluster.name`. The same shape backs
        `GET /api/v1/poolers` (R8.2), which is why `namespace` is carried even
        though the nested copy sits under a cluster that already has one.
      required: [name, namespace, instances, readyInstances]
      properties:
        name:
          type: string
        namespace:
          type: string
        cluster:
          type: string
          description: "`spec.cluster.name` — R1.4's association rule."
        type:
          type: string
          description: '`spec.type`: rw | ro.'
          enum: [rw, ro, ""]
        poolMode:
          type: string
          description: |
            `spec.pgbouncer.poolMode`: transaction | session | statement. R6's
            whole client-attribution problem keys off this value.
          enum: [transaction, session, statement, ""]
        instances:
          type: integer
          description: '`spec.instances` (the Deployment''s replicas).'
        readyInstances:
          type: integer
        phase:
          type: string
          description: '`status.phase` ("active", ...).'
        image:
          type: string
          example: ghcr.io/cloudnative-pg/pgbouncer:1.25.1
        service:
          type: string
          description: The pooler's Service name — R6's connection surface.
        parameters:
          type: object
          description: |
            `spec.pgbouncer.parameters` (default_pool_size, max_client_conn,
            min_pool_size, ...), which R6.2's pool sizing reads.
          additionalProperties:
            type: string
        pods:
          type: array
          description: The pooler pods (`cnpg.io/podRole=pooler`, R1.4).
          items:
            $ref: '#/components/schemas/PoolerPodView'
        metricsURL:
          type: string
          description: |
            The pgbouncer exporter endpoint on 9127 (R1.10's row for pooler
            pods) — the S5 source for R6.

    PoolerPodView:
      type: object
      description: One pod of a Pooler Deployment.
      required: [name, phase, ready]
      properties:
        name:
          type: string
        node:
          type: string
        phase:
          type: string
        ready:
          type: boolean
        ip:
          type: string

    # ---- Build (R11.3) -----------------------------------------------------

    VersionResponse:
      type: object
      description: |
        Body of `GET /api/v1/version` (R11.3). Defined in Go as
        `api.VersionResponse`, not in `dto` — it is served by server.go. The
        same values are exported as the `pgsi_build_info` metric (R9.8), so a
        fleet's version inventory works from Prometheus alone.
      required: [version, commit]
      properties:
        version:
          type: string
          example: 0.1.0
        commit:
          type: string
          example: 9214534

    # ---- PromQL pair (R8.3) ------------------------------------------------

    PromQLQueryRequest:
      type: object
      description: |
        Body of `POST /api/v1/metrics/query` and `POST /api/v1/metrics/system`:
        the Cloud SQL MCP's get_query_metrics / get_system_metrics parameters,
        field for field. The two routes share one request type because the MCP's
        two tools take one parameter object; the difference between them is which
        half of the catalogue they answer, not what they accept.

        `GET` takes the same five fields as query parameters
        (`components.parameters.PromQLQuery` and friends, with Prometheus' own
        `query`/`start`/`end` accepted as aliases).
      required: [promqlQuery]
      properties:
        parent:
          type: string
          description: |
            `namespaces/<ns>/clusters/<name>` — the cluster the query is scoped
            to, in R8.2's addressing. Empty means every cluster the caller can
            see, which is what a fleet-wide dashboard asks for.
          example: namespaces/postgres/clusters/onepg
        resource:
          type: string
          description: |
            The MCP's sub-resource, spelled as R9.3's optional labels:
            `datname=appdb,usename=app`, or `pooler=rw`. A key outside that set is
            a label no pgsi series has, so it is rejected rather than silently
            answering "no series" to a question that meant something else.
          example: datname=appdb,usename=app
        promqlQuery:
          type: string
          description: |
            The query: a catalogue name from the path's `x-promql-catalogue`, the
            exact PromQL behind one, or — in proxy mode — any PromQL string.
          example: aggregate.execution_time
        startTime:
          type: string
          format: date-time
          description: |
            Range start, RFC 3339. Set with `endTime` or not at all; one bound
            alone is 400 InvalidRequest.
          example: "2026-11-26T09:00:00Z"
        endTime:
          type: string
          format: date-time
          description: |
            Range end, RFC 3339. Both bounds present means a range query (proxied
            to `/api/v1/query_range`); neither means an instant query
            (`/api/v1/query`).
          example: "2026-11-26T10:00:00Z"

    PromQLQueryResponse:
      type: object
      description: |
        The answer both routes give — the MCP's `promqlResult` field, and the
        reason there is one response schema and not two. In Go the field is a
        pointer, because an *error* response carries no result at all (it is an
        `ErrorBody` instead); on a 200 it is always present.
      required: [promqlResult]
      properties:
        promqlResult:
          $ref: '#/components/schemas/PromQLResult'

    PromQLResult:
      type: object
      description: |
        The Prometheus result envelope: a `resultType` plus the body that type
        licenses. In proxy mode these are the exact bytes Prometheus returned —
        Go holds `result` as a `json.RawMessage` rather than a decoded value
        because re-marshalling a decoded object reorders its keys, and the
        promise R8.3 makes about a proxied answer is that it *is* the upstream
        answer.
      required: [resultType, result]
      properties:
        resultType:
          type: string
          description: |
            `vector` or `matrix` for every query the catalogue generates. In proxy
            mode it is whatever Prometheus reported, which can also be `scalar` or
            `string`; a plain string rather than an enum so an upstream answer we
            did not anticipate still round-trips instead of failing to decode.
          example: vector
        result:
          description: |
            The body `resultType` licenses. `oneOf` because OpenAPI 3.0 cannot tie
            a property's type to a sibling's value (3.1's `if`/`then` can) and
            Prometheus really does emit a bare number for a `scalar` result.
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/PromQLSeries'
            - type: number
            - type: string

    PromQLSeries:
      type: object
      description: |
        One series: a label set plus its sample(s). `value` and `values` are both
        optional so one type serves both result types — a vector carries `value`,
        a matrix carries `values` — and TestPromQLSeriesMarshalsPerResultType
        pins that each marshals without the other.
      required: [metric]
      properties:
        metric:
          type: object
          additionalProperties:
            type: string
          description: |
            The label set. R9.3's contract is `namespace`, `cluster`, `pod`,
            `instance_role`, plus `datname`/`usename`/`pooler` where the family
            has them; R9.4's aggregate drops `pod` and `instance_role` because an
            aggregate across a cluster's instances has no single instance to name.
        value:
          allOf:
            - $ref: '#/components/schemas/SamplePair'
          description: |
            The single sample of a vector result. A pointer in Go so "no value" is
            expressible — a zero-valued SamplePair would marshal as
            `[0.000,"0"]`, which is a real reading (the epoch, worth zero) rather
            than the absence of one.
        values:
          type: array
          items:
            $ref: '#/components/schemas/SamplePair'
          description: The samples of a matrix result, in time order.

    SamplePair:
      type: array
      minItems: 2
      maxItems: 2
      items:
        oneOf:
          - type: number
          - type: string
      description: |
        Prometheus's `[unix_seconds, "value"]` sample tuple. OpenAPI 3.0 has no
        tuple type — `items` is a single schema, and 3.1's `prefixItems` is what
        would say "a number then a string" — so the pair is described as a
        two-element array whose members are a number or a string. The Go type is
        a struct with named fields plus a `MarshalJSON` that emits the array form
        with three decimal places, which is what Prometheus itself emits.

        The value is a **string**, not a number, because Prometheus renders sample
        values as strings and a float on the wire loses the difference between
        `"1.5"` and `"1.5000000000000002"` that the upstream text keeps.
      example: [1764209523.000, "0.4182"]

    # ---- Batched query series (R8.11) --------------------------------------

    QuerySeriesEnvelope:
      type: object
      description: |
        `dto.Envelope[QuerySeries]` — the second projection of the Go generic
        `Envelope[T any]`, named in this document the way `FleetEnvelope` names
        the one for `/api/v1/clusters` (that schema says "Phase 3 adds one per
        resource the same way"; this is one of them, early).

        The Go side declares it as a type *alias*
        (`type QuerySeriesEnvelope = dto.Envelope[QuerySeries]`), not a struct
        with the same fields: R8.4's envelope has exactly one definition in this
        codebase, and a slot that has already shipped a second hand-written copy
        of a contract does not get to write a third one. The alias gives the
        document a name to `$ref` without inventing fields.
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/QuerySeries'
        meta:
          $ref: '#/components/schemas/Meta'

    QuerySeries:
      type: object
      description: |
        One requested fingerprint's answer: its labels, then the points. The
        label set is R9.3's contract. `fingerprint` is the canonical key and
        `queryid` the secondary, informational one (R9.5b — R3.4 is why: PG18
        changes query-id jumbling, so an id can change for an unchanged query,
        which makes it unfit as a key and fine as a display field).

        `pod` and `instanceRole` are present only when the answer is a single
        instance's — R5.7's compare-up-to-5 needs the (namespace, cluster, pod)
        triple to label a per-instance series — and absent when the points
        aggregate across the cluster's instances, which is what R10.6's table row
        asks for and what makes one entry per fingerprint possible at all.
        `datname` and `usename` are R9.3's database/user additions, the other
        half of R9.4's row identity (per cluster, db, user).

        `points` is `[]`, never null, for a fingerprint the store has never seen:
        an absent array and an empty one mean the same thing to the UI, and the
        house rule `FleetEnvelope.data` states for its own array applies here.
      required: [fingerprint, namespace, cluster, points]
      properties:
        fingerprint:
          type: string
          description: |
            R3.4's normalized fingerprint — the canonical key of the query store
            and of this route's request (R9.5b).
        queryid:
          type: string
          description: |
            PostgreSQL's `queryid`, informational (R9.5b). Absent when the store
            has no id for the fingerprint, which is legal because R3.4 makes the
            id unstable and this route's key is not the id.
        namespace:
          type: string
          description: The namespace the query ran in (R9.3).
        cluster:
          type: string
          description: The CloudNativePG Cluster it ran on (R9.3).
        pod:
          type: string
          description: |
            The instance the series came from, present only for a single-instance
            answer (R9.3, R5.7).
        instanceRole:
          type: string
          description: |
            `primary` or `replica` for the same case; absent on an answer that
            aggregates across instances.
          enum: [primary, replica]
        datname:
          type: string
          description: Database (R9.3's optional label, R9.4's row identity).
        usename:
          type: string
          description: Role that executed the query (R9.3, R9.4).
        points:
          type: array
          description: |
            The per-minute series, in time order. `[]` when the store has no
            points for this fingerprint yet.
          items:
            $ref: '#/components/schemas/QuerySeriesPoint'
      example:
        fingerprint: "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
        queryid: "8123456789012345678"
        namespace: postgres
        cluster: onepg
        pod: onepg-1
        instanceRole: primary
        datname: appdb
        usename: app
        points: []

    QuerySeriesPoint:
      type: object
      description: |
        One minute of one fingerprint's series. The five values are R9.4's
        aggregate family members, named from the member list in
        `internal/api/promql_catalogue.go` rather than re-invented here:
        `execution_time`, `rows`, `shared_blocks_hit`, `shared_blocks_read`,
        `lock_time`. (The catalogue's sixth entry on this route,
        `aggregate.cache_hit_ratio`, is *derived* rather than a member of the
        family, so it is not a field here — it is computed from the two block
        counters where it is served.)

        All five are `number` — `float64` in Go — because that is the type the
        R9.4 family carries: a per-minute delta derived from a cumulative counter
        (R3.3) is not necessarily integral even when the underlying count is.
        The bucket is one minute because R8.11 says "the per-minute series"; the
        range parameter selects the window, never the resolution (R10.15).
      required:
        - timestamp
        - executionTimeSeconds
        - rows
        - sharedBlocksHit
        - sharedBlocksRead
        - lockTimeSeconds
      properties:
        timestamp:
          type: string
          format: date-time
          description: |
            Start of the minute, RFC 3339 UTC (R10.21: every timestamp the API
            emits is RFC 3339 UTC, and `meta.generatedAt` is the same type for
            the same reason).
        executionTimeSeconds:
          type: number
          description: 'R9.4 `execution_time` for the minute, in seconds.'
        rows:
          type: number
          description: "R9.4 `rows` — rows returned, per R3.2's `Avg rows returned` column."
        sharedBlocksHit:
          type: number
          description: 'R9.4 `shared_blocks_hit`.'
        sharedBlocksRead:
          type: number
          description: 'R9.4 `shared_blocks_read`.'
        lockTimeSeconds:
          type: number
          description: |
            R9.4 `lock_time`, in seconds. R3.2 documents that per-query lock time
            has no `pg_stat_statements` source (§5 divergence) and renders `n/a`
            in the R3.2 column set; R9.4 nonetheless names `lock_time` as a member
            of the aggregate family, so the field exists here and its value is
            whatever the store can source (database/user level from R3.7's
            `pg_locks` + `pg_stat_activity` rollup, not per execution).
      example:
        timestamp: "2026-11-21T09:12:00Z"
        executionTimeSeconds: 0.4182
        rows: 1200
        sharedBlocksHit: 48200
        sharedBlocksRead: 12
        lockTimeSeconds: 0.0031
